<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<!-- Firebase SDKs -->

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT:'#105955', 50:'#f0f6f5', 100:'#dbeae8', 200:'#b3d3cf', 300:'#82b6af', 400:'#4f948c', 500:'#2c7a72', 600:'#1a6a63', 700:'#105955', 800:'#0d4744', 900:'#0a3836', 950:'#052120' },
          gold: { DEFAULT:'#D4A359', 50:'#fbf6ee', 100:'#f5e8d2', 200:'#ebd0a4', 300:'#deb26f', 400:'#D4A359', 500:'#c68f3f', 600:'#a97432', 700:'#8a5b2a' },
          cream:'#F9F8F3'
        },
        fontFamily: {
          display:['Fraunces','ui-serif','Georgia','serif'],
          body:['"Public Sans"','ui-sans-serif','system-ui','sans-serif']
        }
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family:'Public Sans', sans-serif; background:#F9F8F3; }
  .font-display { font-family:'Fraunces', serif; }
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-thumb { background:#10595555; border-radius:99px; }
  .scrollbar-none::-webkit-scrollbar{ display:none; }
  .scrollbar-none{ -ms-overflow-style:none; scrollbar-width:none; }
  .leaf-badge { background: radial-gradient(circle at 30% 20%, #1a6a63, #0a3836); }
  .drawer { transition: transform .38s cubic-bezier(.22,.9,.32,1); }
  .drawer-hidden { transform: translateY(100%); }
  .modal-fade { animation: fadeIn .22s ease; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }
  .pulse-dot { animation: pulseDot 1.6s infinite; }
  @keyframes pulseDot { 0%,100%{ opacity:1 } 50%{ opacity:.35 } }
  .card-shadow{ box-shadow: 0 1px 2px rgba(16,89,85,.06), 0 8px 24px -8px rgba(16,89,85,.18); }
</style>
</head>
<body class="text-brand-900">

<div id="app"></div>
<div id="toastHost" class="fixed top-4 left-1/2 -translate-x-1/2 z-[200] flex flex-col gap-2 items-center pointer-events-none"></div>

<script>
const DEFAULT_LOGO = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23105955'/><path d='M50 20 C30 40 30 70 50 80 C70 70 70 40 50 20 Z' fill='%23D4A359'/></svg>";

let DB = {
  settings: { logoUrl: DEFAULT_LOGO, restaurantName:"Phalada Pure & Sure", tagline:"Everyday food, made good. Since 1999" },
  menu: [], retail: [], orders: []
};

let session = { table:null, cafeCart:[], retailCart:[], activeCafeCat:'All', activeRetailCat:'All', search:'', showCrossSell:false, cartOpen:false, custName:'', custPhone:'', dismissedBills: new Set() };

function money(n) { return '₹' + Number(n).toFixed(2); }
function uid(p) { return p + '_' + Math.random().toString(36).slice(2, 9); }
function toast(msg, icon) {
  const host = document.getElementById('toastHost'); if (!host) return;
  const el = document.createElement('div');
  el.className = 'modal-fade pointer-events-auto bg-brand-900 text-cream px-4 py-2.5 rounded-full shadow-lg text-sm font-medium flex items-center gap-2';
  el.innerHTML = `<i data-lucide="${icon || 'check-circle'}" class="w-4 h-4 text-gold-400"></i><span>${msg}</span>`;
  host.appendChild(el); lucide.createIcons();
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2600);
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return s + 's ago';
  const m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60); return h + 'h ago';
}
function etaMinutes(order) {
  const base = order.type === 'retail' ? 4 : 12;
  const elapsedMin = Math.floor((Date.now() - order.ts) / 60000);
  return Math.max(0, base - elapsedMin);
}

function render() {
  document.getElementById('app').innerHTML = customerShell();
  wireCustomer(); lucide.createIcons();
}

function customerShell() {
  const table = session.table;
  const activeOrder = [...DB.orders].reverse().find(o => o.table === table && o.status !== 'served');
  const servedOrder = [...DB.orders].reverse().find(o => o.table === table && o.status === 'served' && !session.dismissedBills.has(o.id));

  return `
  <div class="min-h-screen bg-cream pb-28">
    <header class="sticky top-0 z-30 bg-brand text-cream shadow-lg">
      <div class="max-w-xl mx-auto px-4 pt-3 pb-3 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <img src="${DB.settings.logoUrl}" class="w-10 h-10 object-contain rounded-full bg-white/10 p-1" alt="logo">
          <div>
            <div class="font-display text-lg leading-tight tracking-tight">${DB.settings.restaurantName}</div>
            <div class="text-[11px] text-cream/70 -mt-0.5">${DB.settings.tagline}</div>
          </div>
        </div>
        <div class="text-right">
          <div class="text-[10px] uppercase tracking-widest text-cream/60">Table</div>
          <div class="font-display text-xl leading-none text-gold-400">${table ? String(table).padStart(2,'0') : '—'}</div>
        </div>
      </div>
      <div class="max-w-xl mx-auto px-4 pb-3 flex gap-2">
        ${tabBtn('menu','Cafe Menu','utensils')}
        ${tabBtn('retail','Retail Store','shopping-basket')}
        ${tabBtn('status','My Order','receipt-text')}
      </div>
    </header>

    <main class="max-w-xl mx-auto px-4 pt-4">
      ${!table ? noTableBanner() : ''}
      ${session.custTab === 'retail' ? retailPanel() : session.custTab === 'status' ? statusPanel(activeOrder) : menuPanel()}
    </main>

    ${cartBar()}
    ${cartDrawer()}
    ${session.showCrossSell ? crossSellModal() : ''}
    ${servedOrder ? billModal(servedOrder) : ''}

    <footer class="max-w-xl mx-auto px-4 pt-10 pb-6 text-center">
      <a href="dashboard.html" class="text-[11px] text-brand-400/70 underline hover:text-brand-600">Staff & Kitchen Portal</a>
    </footer>
  </div>`;
}

function tabBtn(key, label, icon) {
  const active = (session.custTab || 'menu') === key;
  return `<button data-tab="${key}" class="cust-tab flex-1 flex items-center justify-center gap-1.5 text-xs font-semibold py-2 rounded-full transition ${active ? 'bg-cream text-brand-800' : 'bg-white/10 text-cream/80 hover:bg-white/20'}">
    <i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${label}
  </button>`;
}

function noTableBanner() {
  return `<div class="mb-4 rounded-2xl border border-gold-300 bg-gold-50 px-4 py-3 flex items-start gap-2.5 text-sm">
    <i data-lucide="qr-code" class="w-4 h-4 mt-0.5 text-gold-700 shrink-0"></i>
    <span class="text-brand-800">No table detected. Scan your table QR code or append <code class="bg-white px-1 rounded">?table=1</code> to the URL.</span>
  </div>`;
}

function menuPanel() {
  const cats = ['All', ...new Set(DB.menu.map(i => i.category))];
  const items = DB.menu.filter(i => (session.activeCafeCat === 'All' || i.category === session.activeCafeCat) && i.name.toLowerCase().includes((session.search || '').toLowerCase()));
  return `
  <div class="relative mb-3">
    <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-brand-400"></i>
    <input id="searchInput" value="${session.search || ''}" placeholder="Search dishes…" class="w-full bg-white border border-brand-100 rounded-full pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-300">
  </div>
  <div class="flex gap-2 overflow-x-auto scrollbar-none pb-3 -mx-4 px-4">
    ${cats.map(c => `<button data-cat="${c}" class="cafe-cat shrink-0 text-xs font-semibold px-3.5 py-1.5 rounded-full border transition ${session.activeCafeCat === c || (!session.activeCafeCat && c === 'All') ? 'bg-brand text-cream border-brand' : 'bg-white text-brand-700 border-brand-100'}">${c}</button>`).join('')}
  </div>
  <div class="grid grid-cols-1 gap-3.5 mt-1">
    ${items.map(dishCard).join('') || emptyState('No dishes found.')}
  </div>`;
}

function badgeChip(b) {
  const map = { '100% Organic':'bg-brand-100 text-brand-800', 'Vegan':'bg-green-100 text-green-800', 'Gluten-Free':'bg-gold-100 text-gold-700' };
  return `<span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${map[b] || 'bg-brand-100 text-brand-700'}">${b}</span>`;
}

function dishCard(item) {
  const inCart = session.cafeCart.find(c => c.id === item.id);
  return `
  <div class="bg-white rounded-2xl card-shadow overflow-hidden flex ${!item.stock ? 'opacity-60' : ''}">
    <img src="${item.img || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500'}" class="w-28 h-auto object-cover shrink-0" onerror="this.style.display='none'">
    <div class="flex-1 p-3.5 min-w-0">
      <div class="flex items-start justify-between gap-2">
        <div class="font-display text-base leading-snug text-brand-900">${item.name}</div>
        ${!item.stock ? '<span class="text-[10px] font-bold text-red-500 shrink-0 whitespace-nowrap">SOLD OUT</span>' : ''}
      </div>
      <div class="flex flex-wrap gap-1 mt-1">${(item.badges || []).map(badgeChip).join('')}</div>
      <p class="text-xs text-brand-500 mt-1.5 line-clamp-2">${item.desc || 'Freshly prepared organic dish.'}</p>
      ${item.nutrition ? `
      <button class="nutri-toggle text-[11px] text-brand-600 underline mt-1" data-id="${item.id}">Nutrition facts</button>
      <div id="nutri-${item.id}" class="hidden mt-1.5 grid grid-cols-4 gap-1 text-center">
        ${nutriPill('Cal', item.nutrition.cal)}${nutriPill('Prot', item.nutrition.protein+'g')}${nutriPill('Carb', item.nutrition.carbs+'g')}${nutriPill('Fat', item.nutrition.fat+'g')}
      </div>` : ''}
      <div class="flex items-center justify-between mt-2.5">
        <span class="font-display text-lg text-brand-800">${money(item.price)}</span>
        ${item.stock ? (inCart ? qtyStepper('cafe', item.id, inCart.qty) : `<button class="add-cafe bg-brand text-cream text-xs font-bold px-4 py-2 rounded-full hover:bg-brand-600 transition" data-id="${item.id}">Add</button>`) : ''}
      </div>
    </div>
  </div>`;
}

function nutriPill(label, val) {
  return `<div class="bg-cream rounded-lg py-1"><div class="text-[9px] text-brand-400 uppercase tracking-wide">${label}</div><div class="text-[11px] font-bold text-brand-800">${val}</div></div>`;
}

function qtyStepper(kind, id, qty) {
  return `<div class="flex items-center gap-2.5 bg-brand-50 rounded-full px-1 py-1">
    <button class="qty-btn w-6 h-6 rounded-full bg-white text-brand-700 font-bold text-sm shadow" data-kind="${kind}" data-id="${id}" data-d="-1">−</button>
    <span class="text-sm font-bold w-4 text-center">${qty}</span>
    <button class="qty-btn w-6 h-6 rounded-full bg-brand text-cream font-bold text-sm shadow" data-kind="${kind}" data-id="${id}" data-d="1">+</button>
  </div>`;
}

function retailPanel() {
  const cats = ['All', ...new Set(DB.retail.map(i => i.category))];
  const items = DB.retail.filter(i => session.activeRetailCat === 'All' || i.category === session.activeRetailCat);
  return `
  <div class="mb-3 rounded-2xl bg-brand text-cream px-4 py-3 flex items-center gap-2.5">
    <i data-lucide="leaf" class="w-4 h-4 text-gold-400 shrink-0"></i>
    <span class="text-xs">Browse organic retail items — cold-pressed oils, A2 ghee &amp; spices (MRP Billed).</span>
  </div>
  <div class="flex gap-2 overflow-x-auto scrollbar-none pb-3 -mx-4 px-4">
    ${cats.map(c => `<button data-rcat="${c}" class="retail-cat shrink-0 text-xs font-semibold px-3.5 py-1.5 rounded-full border transition ${session.activeRetailCat === c || (!session.activeRetailCat && c === 'All') ? 'bg-gold text-white border-gold' : 'bg-white text-brand-700 border-brand-100'}">${c}</button>`).join('')}
  </div>
  <div class="grid grid-cols-2 gap-3">
    ${items.map(retailCard).join('') || emptyState('No products found.')}
  </div>`;
}

function retailCard(item) {
  const inCart = session.retailCart.find(c => c.id === item.id);
  return `
  <div class="bg-white rounded-2xl card-shadow overflow-hidden ${!item.stock ? 'opacity-60' : ''}">
    <img src="${item.img || 'https://images.unsplash.com/photo-1620706857370-e1b9770e8bb1?w=500'}" class="w-full h-24 object-cover" onerror="this.style.display='none'">
    <div class="p-3">
      <div class="font-display text-sm leading-snug text-brand-900">${item.name}</div>
      <div class="text-[10px] text-brand-400">${item.size || ''} (MRP)</div>
      <div class="flex justify-between items-center mt-2">
        <span class="text-sm font-bold text-brand-800">${money(item.price)}</span>
        ${item.stock ? (inCart ? qtyStepper('retail', item.id, inCart.qty) : `<button class="add-retail bg-gold text-white text-[11px] font-bold px-3 py-1.5 rounded-full" data-id="${item.id}">Add</button>`) : `<span class="text-[10px] font-bold text-red-500">SOLD OUT</span>`}
      </div>
    </div>
  </div>`;
}

function emptyState(msg) {
  return `<div class="col-span-2 text-center py-10 text-sm text-brand-400"><i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 text-brand-200"></i>${msg}</div>`;
}

function cartBar() {
  const count = session.cafeCart.reduce((a,c) => a + c.qty, 0) + session.retailCart.reduce((a,c) => a + c.qty, 0);
  if (count === 0 || session.cartOpen) return '';
  const cafeTotal = session.cafeCart.reduce((a,c) => a + c.qty * c.price, 0);
  const retailTotal = session.retailCart.reduce((a,c) => a + c.qty * c.price, 0);
  const total = cafeTotal + (cafeTotal * 0.05) + retailTotal;

  return `
  <button id="openCartBtn" class="fixed bottom-4 left-4 right-4 max-w-xl mx-auto z-40 bg-brand-900 text-cream rounded-2xl px-5 py-3.5 flex items-center justify-between shadow-2xl">
    <span class="flex items-center gap-2 text-sm font-semibold"><i data-lucide="shopping-cart" class="w-4 h-4 text-gold-400"></i>${count} item${count > 1 ? 's' : ''}</span>
    <span class="text-sm font-bold flex items-center gap-1.5">${money(total)} <i data-lucide="chevron-up" class="w-4 h-4"></i></span>
  </button>`;
}

function cartDrawer() {
  const cafeTotal = session.cafeCart.reduce((a,c) => a + c.qty * c.price, 0);
  const retailTotal = session.retailCart.reduce((a,c) => a + c.qty * c.price, 0);
  const cafeGst = cafeTotal * 0.05;
  const grandTotal = cafeTotal + cafeGst + retailTotal;

  return `
  <div id="cartDrawer" class="drawer ${session.cartOpen ? '' : 'drawer-hidden'} fixed inset-x-0 bottom-0 z-50 max-w-xl mx-auto bg-white rounded-t-3xl shadow-2xl max-h-[85vh] flex flex-col">
    <div class="px-5 pt-4 pb-2 flex items-center justify-between border-b border-brand-50">
      <span class="font-display text-lg">Your Order</span>
      <button id="closeCartBtn" class="w-8 h-8 rounded-full bg-brand-50 flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="overflow-y-auto px-5 py-3 flex-1 space-y-3">
      ${session.cafeCart.length ? `<div class="text-xs font-bold uppercase tracking-wide text-brand-400 mb-1.5">Cafe Order</div>${session.cafeCart.map(cartLine).join('')}` : ''}
      ${session.retailCart.length ? `<div class="text-xs font-bold uppercase tracking-wide text-gold-600 mt-3 mb-1.5">Retail Request</div>${session.retailCart.map(cartLine).join('')}` : ''}
      ${!session.cafeCart.length && !session.retailCart.length ? emptyState('Your cart is empty.') : ''}
      
      <div class="border-t border-brand-50 pt-3 space-y-2">
        <div class="text-xs font-bold uppercase tracking-wide text-brand-700">Customer Details</div>
        <div>
          <label class="text-[11px] font-semibold text-brand-600">Your Name *</label>
          <input id="custNameInput" type="text" value="${session.custName || ''}" placeholder="Enter your full name" class="w-full mt-0.5 text-sm border border-brand-100 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-300">
        </div>
        <div>
          <label class="text-[11px] font-semibold text-brand-600">Phone Number (10 digits) *</label>
          <input id="custPhoneInput" type="tel" maxlength="10" value="${session.custPhone || ''}" placeholder="e.g. 9876543210" class="w-full mt-0.5 text-sm border border-brand-100 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-300">
        </div>
        <div>
          <label class="text-[11px] font-semibold text-brand-600">Dietary / special instructions</label>
          <textarea id="cartNotes" rows="2" placeholder="e.g. less spicy…" class="w-full mt-0.5 text-sm border border-brand-100 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-300">${session.cartNotes || ''}</textarea>
        </div>
      </div>
    </div>
    <div class="px-5 py-4 border-t border-brand-50 space-y-1.5 bg-white">
      ${session.cafeCart.length ? `<div class="flex justify-between text-xs text-brand-600"><span>Cafe Subtotal</span><span>${money(cafeTotal)}</span></div>` : ''}
      ${session.cafeCart.length ? `<div class="flex justify-between text-xs text-brand-500"><span>GST (5% on Cafe Items)</span><span>${money(cafeGst)}</span></div>` : ''}
      ${session.retailCart.length ? `<div class="flex justify-between text-xs text-brand-600"><span>Retail Total (MRP - Incl. Taxes)</span><span>${money(retailTotal)}</span></div>` : ''}
      <div class="flex justify-between text-sm font-bold text-brand-900 border-t border-brand-50 pt-1.5"><span>Total Amount</span><span>${money(grandTotal)}</span></div>
      <button id="placeOrderBtn" class="w-full mt-2 bg-brand text-cream font-bold py-3.5 rounded-full text-sm disabled:opacity-40" ${(!session.cafeCart.length && !session.retailCart.length) ? 'disabled' : ''}>
        ${!session.table ? 'Select a table first' : 'Place Order — ' + money(grandTotal)}
      </button>
    </div>
  </div>`;
}

function cartLine(c) {
  return `<div class="flex items-center justify-between py-1.5">
    <div class="min-w-0"><div class="text-sm font-medium truncate">${c.name}</div><div class="text-xs text-brand-400">${money(c.price)} × ${c.qty}</div></div>
    ${qtyStepper(c.kind, c.id, c.qty)}
  </div>`;
}

function billModal(order) {
  const cafeItems = order.items.filter(it => it.kind === 'cafe' || (!it.kind && order.type === 'cafe'));
  const retailItems = order.items.filter(it => it.kind === 'retail' || (!it.kind && order.type === 'retail'));

  const cafeSubtotal = cafeItems.reduce((sum, item) => sum + (item.price * item.qty), 0);
  const cafeGst = cafeSubtotal * 0.05;
  const retailTotal = retailItems.reduce((sum, item) => sum + (item.price * item.qty), 0);
  const grandTotal = cafeSubtotal + cafeGst + retailTotal;

  return `
  <div class="fixed inset-0 z-[100] bg-brand-950/70 flex items-center justify-center p-4">
    <div class="modal-fade bg-white rounded-3xl max-w-sm w-full p-6 text-center shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="w-12 h-12 rounded-full bg-green-100 text-green-700 mx-auto flex items-center justify-center mb-2">
        <i data-lucide="receipt" class="w-6 h-6"></i>
      </div>
      <h3 class="font-display text-xl text-brand-900 mb-0.5">Order Served!</h3>
      <p class="text-xs text-brand-500 mb-3">Table ${order.table} · #${order.id.slice(-4)}</p>

      <div class="bg-cream rounded-2xl p-4 text-left space-y-2 mb-4">
        <div class="text-xs font-bold text-brand-800 border-b border-brand-100 pb-1.5 flex justify-between">
          <span>Customer:</span>
          <span>${order.customerName || 'Guest'}</span>
        </div>

        ${cafeItems.length ? `
          <div class="text-[10px] font-bold uppercase tracking-wide text-brand-600 pt-1">Cafe Items</div>
          <div class="space-y-1">
            ${cafeItems.map(it => `
              <div class="flex justify-between text-xs text-brand-700">
                <span>${it.qty}× ${it.name}</span>
                <span>${money(it.price * it.qty)}</span>
              </div>
            `).join('')}
          </div>
        ` : ''}

        ${retailItems.length ? `
          <div class="text-[10px] font-bold uppercase tracking-wide text-gold-700 pt-1">Retail Products (MRP)</div>
          <div class="space-y-1">
            ${retailItems.map(it => `
              <div class="flex justify-between text-xs text-brand-700">
                <span>${it.qty}× ${it.name}</span>
                <span>${money(it.price * it.qty)}</span>
              </div>
            `).join('')}
          </div>
        ` : ''}

        <div class="border-t border-brand-100 pt-2 space-y-1 text-xs">
          ${cafeSubtotal > 0 ? `<div class="flex justify-between text-brand-600"><span>Cafe Subtotal</span><span>${money(cafeSubtotal)}</span></div>` : ''}
          ${cafeGst > 0 ? `<div class="flex justify-between text-brand-500"><span>GST (5% Cafe Tax)</span><span>${money(cafeGst)}</span></div>` : ''}
          ${retailTotal > 0 ? `<div class="flex justify-between text-gold-700"><span>Retail Total (MRP)</span><span>${money(retailTotal)}</span></div>` : ''}
          <div class="flex justify-between font-bold text-sm text-brand-900 border-t border-brand-100 pt-2 mt-1">
            <span>Grand Total</span>
            <span class="text-brand text-base">${money(grandTotal)}</span>
          </div>
        </div>
      </div>

      <button id="closeBillBtn" data-id="${order.id}" class="w-full bg-brand text-cream font-bold py-3 rounded-full text-sm hover:bg-brand-600 transition">Close Receipt</button>
    </div>
  </div>`;
}

function crossSellModal() {
  return `
  <div class="fixed inset-0 z-[60] bg-brand-950/60 flex items-end sm:items-center justify-center p-4">
    <div class="modal-fade bg-white rounded-3xl max-w-sm w-full p-6 text-center">
      <div class="w-14 h-14 rounded-full leaf-badge mx-auto flex items-center justify-center mb-3"><i data-lucide="leaf" class="w-6 h-6 text-gold-300"></i></div>
      <h3 class="font-display text-xl mb-1.5">Order received!</h3>
      <p class="text-sm text-brand-500 mb-4">While your food is being prepared, browse our organic retail range.</p>
      <div class="flex flex-col gap-2">
        <button id="browseRetailBtn" class="bg-gold text-white font-bold py-3 rounded-full text-sm">Browse Retail Store</button>
        <button id="dismissCrossSell" class="text-brand-500 text-sm py-1">Track my order</button>
      </div>
    </div>
  </div>`;
}

function statusPanel(order) {
  if (!order) {
    const past = [...DB.orders].reverse().filter(o => o.table === session.table);
    return `<div class="pt-6">${emptyState('No active order for this table.')}
      ${past.length ? `<div class="mt-6"><div class="text-xs font-bold uppercase tracking-wide text-brand-400 mb-2">Past orders today</div>${past.slice(0,4).map(orderHistoryRow).join('')}</div>` : ''}
    </div>`;
  }
  const steps = ['received', 'preparing', 'ready'];
  const idx = steps.indexOf(order.status);
  const eta = etaMinutes(order);
  return `
  <div class="bg-white rounded-2xl card-shadow p-5 mt-2">
    <div class="flex items-center justify-between mb-4">
      <span class="text-xs font-bold uppercase tracking-wide ${order.type === 'retail' ? 'text-gold-600' : 'text-brand-500'}">${order.type === 'retail' ? 'Retail Request' : 'Cafe Order'} · #${order.id.slice(-4)}</span>
      <span class="text-[11px] text-brand-400">${timeAgo(order.ts)}</span>
    </div>
    <div class="flex items-center mb-3">
      ${steps.map((s, i) => `
        <div class="flex-1 flex flex-col items-center relative">
          ${i > 0 ? `<div class="absolute top-3.5 right-1/2 w-full h-0.5 ${idx >= i ? 'bg-brand' : 'bg-brand-100'}"></div>` : ''}
          <div class="w-7 h-7 rounded-full flex items-center justify-center z-10 ${idx >= i ? 'bg-brand text-cream' : 'bg-brand-100 text-brand-400'} ${idx === i ? 'pulse-dot' : ''}">
            <i data-lucide="${i === 0 ? 'clipboard-check' : i === 1 ? 'flame' : 'bell'}" class="w-3.5 h-3.5"></i>
          </div>
          <span class="text-[10px] mt-1 font-semibold capitalize ${idx >= i ? 'text-brand-800' : 'text-brand-300'}">${s}</span>
        </div>`).join('')}
    </div>
    ${order.status !== 'ready' ? `<div class="text-center text-sm text-brand-500 mb-3">Estimated time remaining: <span class="font-bold text-brand-800">${eta} min</span></div>` : `<div class="text-center text-sm font-bold text-green-600 mb-3">Your order is ready!</div>`}
    <div class="border-t border-brand-50 pt-3 space-y-1">
      ${order.items.map(it => `<div class="flex justify-between text-sm"><span>${it.qty}× ${it.name}</span><span class="text-brand-500">${money(it.qty*it.price)}</span></div>`).join('')}
    </div>
    ${order.notes ? `<div class="mt-2 text-xs text-brand-500 bg-cream rounded-lg px-3 py-2"><i data-lucide="message-square" class="w-3 h-3 inline mr-1"></i>${order.notes}</div>` : ''}
  </div>`;
}

function orderHistoryRow(o) {
  return `<div class="flex justify-between items-center py-2 border-b border-brand-50 text-sm">
    <span>${o.type === 'retail' ? 'Retail' : 'Cafe'} · #${o.id.slice(-4)}</span>
    <span class="text-brand-400 text-xs">${o.status}</span>
  </div>`;
}

function wireCustomer() {
  document.querySelectorAll('.cust-tab').forEach(b => b.onclick = () => { session.custTab = b.dataset.tab; render(); });
  const search = document.getElementById('searchInput');
  if (search) search.oninput = (e) => { session.search = e.target.value; renderKeepFocus('searchInput'); };

  document.querySelectorAll('.cafe-cat').forEach(b => b.onclick = () => { session.activeCafeCat = b.dataset.cat; render(); });
  document.querySelectorAll('.retail-cat').forEach(b => b.onclick = () => { session.activeRetailCat = b.dataset.rcat; render(); });

  document.querySelectorAll('.nutri-toggle').forEach(b => b.onclick = () => {
    document.getElementById('nutri-' + b.dataset.id).classList.toggle('hidden');
  });

  document.querySelectorAll('.add-cafe').forEach(b => b.onclick = () => {
    const item = DB.menu.find(m => m.id === b.dataset.id);
    session.cafeCart.push({ kind:'cafe', id:item.id, name:item.name, price:item.price, qty:1 });
    render();
  });
  document.querySelectorAll('.add-retail').forEach(b => b.onclick = () => {
    const item = DB.retail.find(m => m.id === b.dataset.id);
    session.retailCart.push({ kind:'retail', id:item.id, name:item.name, price:item.price, qty:1 });
    render();
  });
  document.querySelectorAll('.qty-btn').forEach(b => b.onclick = () => {
    const arr = b.dataset.kind === 'cafe' ? session.cafeCart : session.retailCart;
    const idx = arr.findIndex(c => c.id === b.dataset.id);
    if (idx > -1) { arr[idx].qty += Number(b.dataset.d); if (arr[idx].qty <= 0) arr.splice(idx, 1); }
    render();
  });

  const openCart = document.getElementById('openCartBtn'); if (openCart) openCart.onclick = () => { session.cartOpen = true; render(); };
  const closeCart = document.getElementById('closeCartBtn'); if (closeCart) closeCart.onclick = () => { session.cartOpen = false; render(); };
  
  const nameInput = document.getElementById('custNameInput'); if (nameInput) nameInput.oninput = (e) => { session.custName = e.target.value; };
  const phoneInput = document.getElementById('custPhoneInput'); if (phoneInput) phoneInput.oninput = (e) => { session.custPhone = e.target.value.replace(/\D/g, ''); };
  const notes = document.getElementById('cartNotes'); if (notes) notes.oninput = (e) => { session.cartNotes = e.target.value; };

  const placeBtn = document.getElementById('placeOrderBtn');
  if (placeBtn) placeBtn.onclick = async () => {
    if (!session.table) { toast('Please scan a table QR code first.', 'alert-triangle'); return; }
    
    const name = (session.custName || '').trim();
    const phone = (session.custPhone || '').trim();

    if (!name) {
      toast('Please enter your name.', 'alert-triangle');
      document.getElementById('custNameInput')?.focus();
      return;
    }

    if (!phone || phone.length !== 10 || !/^\d{10}$/.test(phone)) {
      toast('Please enter a valid 10-digit phone number.', 'alert-triangle');
      document.getElementById('custPhoneInput')?.focus();
      return;
    }

    const newOrder = {
      id: uid('ord'),
      table: session.table,
      customerName: name,
      customerPhone: phone,
      type: session.cafeCart.length && session.retailCart.length ? 'combined' : (session.cafeCart.length ? 'cafe' : 'retail'),
      items: [...session.cafeCart, ...session.retailCart].map(c => ({ kind: c.kind, name: c.name, qty: c.qty, price: c.price })),
      notes: session.cartNotes || '',
      status: 'received',
      ts: Date.now()
    };

    await db.ref('orders/' + newOrder.id).set(newOrder);

    session.cafeCart = []; session.retailCart = []; session.cartNotes = ''; session.cartOpen = false; session.showCrossSell = true;
    render(); toast('Order placed successfully!', 'check-circle');
  };

  const dismissCross = document.getElementById('dismissCrossSell'); if (dismissCross) dismissCross.onclick = () => { session.showCrossSell = false; session.custTab = 'status'; render(); };
  const browseRetail = document.getElementById('browseRetailBtn'); if (browseRetail) browseRetail.onclick = () => { session.showCrossSell = false; session.custTab = 'retail'; render(); };

  const closeBill = document.getElementById('closeBillBtn');
  if (closeBill) closeBill.onclick = () => {
    session.dismissedBills.add(closeBill.dataset.id);
    render();
  };
}

function renderKeepFocus(id) {
  const el = document.activeElement; const pos = el && el.selectionStart; render();
  const el2 = document.getElementById(id); if (el2) { el2.focus(); if (pos != null) el2.setSelectionRange(pos, pos); }
}

db.ref('menu').on('value', snap => {
  const data = snap.val();
  DB.menu = data ? Object.values(data) : [];
  if (!session.cartOpen) render();
});

db.ref('retail').on('value', snap => {
  const data = snap.val();
  DB.retail = data ? Object.values(data) : [];
  if (!session.cartOpen) render();
});

db.ref('orders').on('value', snap => {
  const data = snap.val();
  DB.orders = data ? Object.values(data) : [];
  if (!session.cartOpen) render();
});

db.ref('settings').on('value', snap => {
  const data = snap.val();
  if (data) { DB.settings = data; if (!session.cartOpen) render(); }
});

(function boot() {
  const qs = new URLSearchParams(location.search);
  const t = qs.get('table');
  if (t && Number(t) >= 1 && Number(t) <= 20) session.table = Number(t);
  session.custTab = 'menu';
  render();
})();
</script>
</body>
</html>
