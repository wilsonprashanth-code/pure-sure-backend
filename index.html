<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phalada Pure & Sure Organic Cafe</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    :root { --primary: #0a5c43; --bg: #f4f7f6; --text: #1f2937; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); margin: 0; padding: 0; color: var(--text); padding-bottom: 120px; }

    header { background: var(--primary); color: white; padding: 20px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
    .brand { font-weight: bold; font-size: 18px; }
    .table-badge { background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; font-size: 12px; display: inline-block; margin-top: 8px; }

    .section-title { font-size: 16px; font-weight: bold; margin: 20px 20px 10px; color: var(--primary); }
    .menu-container { padding: 0 20px; }

    .dish-card { background: white; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
    .dish-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
    .dish-price { font-weight: bold; color: var(--primary); }
    .add-btn { background: var(--primary); color: white; border: none; padding: 6px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* Cross-Sell Retail Products Carousel */
    .cross-sell-wrapper { padding: 0 20px; overflow-x: auto; display: flex; gap: 12px; scrollbar-width: none; }
    .retail-card { background: #eef7f4; border: 1px solid #c2e5d9; border-radius: 10px; padding: 12px; min-width: 160px; text-align: center; flex-shrink: 0; }
    .retail-title { font-size: 12px; font-weight: bold; margin-bottom: 4px; }
    .retail-price { font-size: 13px; color: var(--primary); font-weight: bold; margin-bottom: 8px; }

    /* Floating Cart Bar */
    .cart-float-bar { position: fixed; bottom: 15px; left: 15px; right: 15px; background: var(--primary); color: white; border-radius: 14px; padding: 14px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 20px rgba(0,0,0,0.2); display: none; }
  </style>
</head>
<body>

  <header>
    <div class="brand">🌱 phalada pure & sure</div>
    <div class="table-badge" id="tableDisplay">📍 Table 01</div>
  </header>

  <div class="section-title">Organic Cafe Dishes</div>
  <div class="menu-container" id="cafeMenu">Loading cafe items...</div>

  <div class="section-title">🛒 Take Home Organic Retail Products (Cross-Sell)</div>
  <div class="cross-sell-wrapper" id="retailMenu">Loading retail recommendations...</div>

  <div class="cart-float-bar" id="cartBar">
    <div>
      <div id="cartCount" style="font-size:12px;">0 Items</div>
      <div id="cartTotal" style="font-weight:bold;">Total: ₹0</div>
    </div>
    <button class="add-btn" style="background:#22c55e;" onclick="submitOrder()">Confirm Order</button>
  </div>

  <script>
    const API_URL = 'https://pure-sure-api.onrender.com';
    const socket = io(API_URL);
    let cart = [];

    const urlParams = new URLSearchParams(window.location.search);
    const tableNum = urlParams.get('table') || '1';
    document.getElementById('tableDisplay').innerText = `📍 Table ${tableNum.padStart(2, '0')}`;

    async function loadMenu() {
      const res = await fetch(`${API_URL}/api/menu`);
      const items = await res.json();
      
      const cafeContainer = document.getElementById('cafeMenu');
      const retailContainer = document.getElementById('retailMenu');

      const activeItems = items.filter(i => i.inStock !== false);

      // Render Cafe Hot Dishes
      const cafeItems = activeItems.filter(i => i.category !== 'retail');
      cafeContainer.innerHTML = cafeItems.map(i => `
        <div class="dish-card">
          <div>
            <div class="dish-title">${i.name}</div>
            <div class="dish-price">₹${i.price}</div>
          </div>
          <button class="add-btn" onclick="addToCart('${i.name}', ${i.price})">+ Add</button>
        </div>
      `).join('');

      // Render Cross-Selling Retail Items
      const retailItems = activeItems.filter(i => i.category === 'retail');
      if (retailItems.length === 0) {
        retailContainer.innerHTML = '<p style="font-size:12px; color:#666;">No retail cross-sell items available.</p>';
      } else {
        retailContainer.innerHTML = retailItems.map(i => `
          <div class="retail-card">
            <div class="retail-title">${i.name}</div>
            <div class="retail-price">₹${i.price}</div>
            <button class="add-btn" style="padding:4px 10px; font-size:11px;" onclick="addToCart('${i.name} (Retail)', ${i.price})">+ Add Pack</button>
          </div>
        `).join('');
      }
    }

    function addToCart(name, price) {
      cart.push({ name, price, qty: 1 });
      document.getElementById('cartBar').style.display = 'flex';
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cartCount').innerText = `${cart.length} ITEMS`;
      document.getElementById('cartTotal').innerText = `Total: ₹${total}`;
    }

    async function submitOrder() {
      await fetch(`${API_URL}/api/orders`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: 'ORD-' + Date.now().toString().slice(-6),
          table: tableNum,
          items: cart,
          type: 'Dine-In + Retail Cross-Sell',
          status: 'received'
        })
      });
      alert('Order submitted successfully!');
      cart = [];
      document.getElementById('cartBar').style.display = 'none';
    }

    loadMenu();
    socket.on('menu_updated', () => loadMenu());
  </script>
</body>
</html>
