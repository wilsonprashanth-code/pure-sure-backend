<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phalada Pure & Sure Organic Cafe</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    :root {
      --primary: #0a5c43;
      --primary-dark: #063d2c;
      --bg: #f4f7f6;
      --card-bg: #ffffff;
      --text: #2c3e50;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); margin: 0; padding: 0; color: var(--text); }

    /* Header Styling */
    header { background: var(--primary); color: white; padding: 20px 15px; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; }
    .brand-title { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 20px; }
    .table-badge { display: inline-block; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; font-size: 13px; margin-top: 10px; }

    .container { padding: 15px; max-width: 600px; margin: 0 auto; }

    /* Dish Card Layout */
    .dish-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; }
    .dish-info h3 { margin: 0 0 5px 0; font-size: 16px; color: var(--text); }
    .dish-price { font-weight: bold; color: var(--primary); font-size: 15px; }

    .add-btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .add-btn:active { background: var(--primary-dark); }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <span>🥗</span> phalada pure & sure
    </div>
    <p style="margin: 4px 0 0 0; font-size: 12px; opacity: 0.9;">EVERYDAY FOOD, MADE GOOD.</p>
    <div class="table-badge" id="tableDisplay">📍 Table 01</div>
  </header>

  <div class="container">
    <h2 style="font-size: 18px; margin-top: 10px;">Organic Cafe Menu</h2>
    <div id="menuContainer">Loading dynamic menu...</div>
  </div>

  <script>
    const API_URL = 'https://pure-sure-api.onrender.com';
    const socket = io(API_URL);

    // Get Table Number from URL Params (?table=2)
    const urlParams = new URLSearchParams(window.location.search);
    const tableNum = urlParams.get('table') || '1';
    document.getElementById('tableDisplay').innerText = `📍 Table ${tableNum.padStart(2, '0')}`;

    // Fetch dynamic menu directly from Render Cloud API
    async function fetchLiveMenu() {
      try {
        const res = await fetch(`${API_URL}/api/menu`);
        const items = await res.json();
        
        // Filter out items marked as out-of-stock
        const inStockItems = items.filter(item => item.inStock !== false);
        renderMenu(inStockItems);
      } catch (err) {
        console.error('Error fetching menu:', err);
        document.getElementById('menuContainer').innerHTML = '<p>Unable to load menu right now.</p>';
      }
    }

    function renderMenu(items) {
      const container = document.getElementById('menuContainer');
      if (!items.length) {
        container.innerHTML = '<p>No items currently available.</p>';
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="dish-card">
          <div class="dish-info">
            <h3>${item.name}</h3>
            <div class="dish-price">₹${item.price}</div>
          </div>
          <button class="add-btn" onclick="addToCart('${item.name}', ${item.price})">+ Add</button>
        </div>
      `).join('');
    }

    async function addToCart(name, price) {
      // Direct API Order Post
      const orderPayload = {
        id: 'ORD-' + Date.now().toString().slice(-6),
        table: tableNum,
        items: [{ name, price, qty: 1 }],
        type: 'Dine-In',
        status: 'received'
      };

      await fetch(`${API_URL}/api/orders`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(orderPayload)
      });

      alert(`Added "${name}" to your order!`);
    }

    // Load menu immediately on startup
    fetchLiveMenu();

    // Re-fetch menu automatically whenever admin modifies items/stock
    socket.on('menu_updated', () => fetchLiveMenu());
  </script>
</body>
</html>
