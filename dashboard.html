function money(n) { return '₹' + Number(n || 0).toFixed(2); }
function uid(p) { return p + '_' + Math.random().toString(36).slice(2, 9); }
function toast(msg, icon) {
  const host = document.getElementById('toastHost'); if (!host) return;
  const el = document.createElement('div');
  el.className = 'modal-fade pointer-events-auto bg-brand-900 text-cream px-4 py-2.5 rounded-full shadow-xl text-xs sm:text-sm font-medium flex items-center gap-2 max-w-full truncate';
  el.innerHTML = `<i data-lucide="${icon || 'check-circle'}" class="w-4 h-4 text-gold-400 shrink-0"></i><span class="truncate">${msg}</span>`;
  host.appendChild(el); try { lucide.createIcons(); } catch(e){}
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2600);
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return s + 's ago';
  const m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60); return h + 'h ago';
}

function formatTime(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function calculateOrderTotal(order) {
  const items = order.items || [];
  const sub = items.reduce((a, b) => a + (b.price * b.qty), 0);
  return sub + (sub * 0.05);
}

function getRawMaterialDetails(name) {
  if (!name) return { unitPrice: 0, vendor: 'FACTORY', unit: 'GRM' };
  const cleanName = name.toLowerCase().trim();
  const found = DB.rawMaterials.find(r => (r.name || '').toLowerCase().trim() === cleanName);
  return found || { unitPrice: 0, vendor: 'FACTORY', unit: 'GRM' };
}

function getConvertedGramsMl(qty, unit) {
  const q = Number(qty || 0);
  const u = (unit || 'GRM').toUpperCase();
  switch(u) {
    case 'KG':
    case 'LITRE': return q * 1000;
    case 'TSP': return q * 5;
    case 'TBSP': return q * 15;
    case 'GRM':
    case 'ML':
    case 'PCS':
    case 'NOS':
    default: return q;
  }
}

function calculateIngCost(ing) {
  const qty = Number(ing.qty || 0);
  const unit = (ing.unit || 'GRM').toUpperCase();
  let rate = Number(ing.unitPrice || 0);
  if (!rate && ing.name) rate = getRawMaterialDetails(ing.name).unitPrice;
  let gramsMl = Number(ing.gramsMl || getConvertedGramsMl(qty, unit));
  return (gramsMl / 1000) * rate;
}

function calculateBaseRecipeCostPerUnit(base) {
  if (!base || !base.ingredients) return 0;
  const totalBatchCost = base.ingredients.reduce((sum, ing) => sum + calculateIngCost(ing), 0);
  const yieldQty = Number(base.batchYield || 1);
  return yieldQty > 0 ? (totalBatchCost / yieldQty) : 0;
}

function getDishFoodCostPercent(dish) {
  const recipe = DB.recipes[dish.id];
  if (!recipe || !recipe.ingredients) return 0;
  const rawTotal = (recipe.ingredients || []).reduce((sum, ing) => sum + calculateIngCost(ing), 0);
  const portionCost = recipe.portions ? (rawTotal / recipe.portions) : 0;
  const price = Number(dish.price || 0);
  return price > 0 ? (portionCost / price) * 100 : 0;
}

async function processBOMDeduction(dishId, orderedPortions = 1) {
  const recipe = DB.recipes[dishId];
  if (!recipe || !recipe.ingredients) return;
  const updates = {};
  recipe.ingredients.forEach(ing => {
    const rm = DB.rawMaterials.find(r => (r.name || '').toLowerCase().trim() === (ing.name || '').toLowerCase().trim());
    if (rm) {
      const requiredGrams = getConvertedGramsMl(ing.qty, ing.unit) * orderedPortions;
      const currentStock = Number(rm.stockGrams ?? 100000);
      updates[`rawMaterials/${rm.id}/stockGrams`] = Math.max(0, currentStock - requiredGrams);
    }
  });
  if (Object.keys(updates).length > 0) await db.ref().update(updates);
}

function exportBillWiseReportToExcel() {
  const data = DB.orders.filter(o => o.status === 'served').map(o => ({
    "Order ID": o.id, "Date": new Date(o.ts).toLocaleDateString(), "Table": o.table, "Customer": o.customerName || 'Guest', "Total (₹)": calculateOrderTotal(o).toFixed(2)
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Bill-Wise Sales");
  XLSX.writeFile(wb, "BillWise_Sales_Report.xlsx");
  toast("Bill-Wise Report downloaded!", "file-spreadsheet");
}

function exportItemWiseReportToExcel() {
  const itemSales = {};
  DB.orders.filter(o => o.status === 'served').forEach(o => {
    (o.items || []).forEach(i => {
      if (!itemSales[i.name]) itemSales[i.name] = { qty: 0, revenue: 0 };
      itemSales[i.name].qty += Number(i.qty || 1);
      itemSales[i.name].revenue += Number(i.price || 0) * Number(i.qty || 1);
    });
  });
  const data = Object.entries(itemSales).map(([name, info]) => ({ "Item Name": name, "Units Sold": info.qty, "Revenue (₹)": info.revenue.toFixed(2) }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Item-Wise Sales");
  XLSX.writeFile(wb, "ItemWise_Sales_Report.xlsx");
  toast("Item-Wise Report downloaded!", "file-spreadsheet");
}

function wireLogin() {
  const btn = document.getElementById('loginSubmit');
  if (btn) {
    btn.onclick = () => {
      unlockAudio();
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value;
      const found = DB.staff.find(s => s.username === u && s.password === p);
      if (found) {
        session.staff = found;
        localStorage.setItem('ps_staff', JSON.stringify(found));
        render();
        toast('Logged in successfully', 'log-in');
      } else {
        const err = document.getElementById('loginError');
        if (err) { err.textContent = 'Incorrect credentials.'; err.classList.remove('hidden'); }
      }
    };
  }
}

function wireKitchen() {
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) logoutBtn.onclick = () => { localStorage.removeItem('ps_staff'); session.staff = null; render(); };

  document.querySelectorAll('.k-tab').forEach(b => {
    b.onclick = () => { session.kitchenTab = b.dataset.ktab; render(); };
  });

  // Modals
  const openBill = document.getElementById('openBillingModalBtn');
  if (openBill) openBill.onclick = () => { session.showBillingModal = true; render(); };
  const closeBill = document.getElementById('closeBillingModalBtn');
  if (closeBill) closeBill.onclick = () => { session.showBillingModal = false; render(); };

  const openPurch = document.getElementById('openPurchaseModalBtn');
  if (openPurch) openPurch.onclick = () => { session.showPurchaseModal = true; render(); };
  const closePurch = document.getElementById('closePurchaseModalBtn');
  if (closePurch) closePurch.onclick = () => { session.showPurchaseModal = false; render(); };

  const openStock = document.getElementById('openStockTakeModalBtn');
  if (openStock) openStock.onclick = () => { session.showStockTakeModal = true; render(); };
  const closeStock = document.getElementById('closeStockTakeModalBtn');
  if (closeStock) closeStock.onclick = () => { session.showStockTakeModal = false; render(); };

  const openWaste = document.getElementById('openWastageModalBtn');
  if (openWaste) openWaste.onclick = () => { session.showWastageModal = true; render(); };
  const closeWaste = document.getElementById('closeWastageModalBtn');
  if (closeWaste) closeWaste.onclick = () => { session.showWastageModal = false; render(); };

  // Advance order status
  document.querySelectorAll('.advance-order-btn').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      const next = btn.dataset.next;
      await db.ref(`orders/${id}/status`).set(next);
      toast(`Order #${id} updated to ${next}`, 'check-circle');
    };
  });

  // Complete POS sale
  const completeBill = document.getElementById('completeSalesBillBtn');
  if (completeBill) {
    completeBill.onclick = async () => {
      const orderId = Math.floor(1000 + Math.random() * 9000).toString();
      const items = session.salesItems || [];
      const newOrder = {
        id: orderId, table: 'Table 12', type: 'cafe', customerName: session.salesCustomerName || 'Walk-In', items: items.map(i=>({ id: i.id, name: i.itemName, price: i.rate, qty: i.qty })), status: 'served', ts: Date.now()
      };
      await db.ref('orders/' + orderId).set(newOrder);
      for (const item of items) {
        if (item.id) await processBOMDeduction(item.id, item.qty);
      }
      toast('POS Bill completed & stock deducted!', 'check-circle');
      session.showBillingModal = false;
      render();
    };
  }

  // Save stock take
  const saveStock = document.getElementById('saveStockTakeBtn');
  if (saveStock) {
    saveStock.onclick = async () => {
      const updates = {};
      document.querySelectorAll('.physical-count-input').forEach(inp => {
        const id = inp.dataset.id;
        const grams = Number(inp.value || 0) * 1000;
        updates[`rawMaterials/${id}/stockGrams`] = grams;
      });
      await db.ref().update(updates);
      toast('Stock take reconciled successfully!', 'check-circle');
      session.showStockTakeModal = false;
      render();
    };
  }

  // Submit wastage
  const submitWaste = document.getElementById('submitWastageBtn');
  if (submitWaste) {
    submitWaste.onclick = async () => {
      const rmName = document.getElementById('wastageRmSelect').value;
      const qty = Number(document.getElementById('wastageQtyInput').value) || 0;
      const reason = document.getElementById('wastageReasonInput').value || 'Spoilage';
      const rm = DB.rawMaterials.find(r => r.name.toLowerCase() === rmName.toLowerCase());
      if (rm) {
        const currentStock = Number(rm.stockGrams ?? 100000);
        await db.ref(`rawMaterials/${rm.id}/stockGrams`).set(Math.max(0, currentStock - (qty * 1000)));
      }
      DB.wastageLogs.push({ id: uid('w'), item: rmName, qty, unit: 'KG', reason, staff: session.staff.username, ts: Date.now() });
      await db.ref('wastageLogs').set(DB.wastageLogs);
      toast('Wastage logged & stock updated!', 'trash-2');
      session.showWastageModal = false;
      render();
    };
  }
}

// Database Listeners

db.ref('rawMaterials').on('value', snap => { DB.rawMaterials = snap.val() ? Object.values(snap.val()) : []; render(); });

(function boot() {
  document.addEventListener('click', unlockAudio, { once: true });

  // Global Click Delegation
  document.addEventListener('click', (e) => {
    const tab = e.target.closest('[data-ktab]');
    if (tab) { session.kitchenTab = tab.dataset.ktab; render(); }

  render();
})();
