function compressAndGetBase64(file, maxWidth = 600, maxHeight = 600, quality = 0.7) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve('');
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > height) {
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
        } else {
          if (height > maxHeight) {
            width = Math.round((width * maxHeight) / height);
            height = maxHeight;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = (err) => reject(err);
    };
    reader.onerror = (err) => reject(err);
  });
}

let actx = null;
function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch(e) {}
}

function playLoudAlarm() {
  if (!session.soundOn || !session.staff) return;
  unlockAudio();
  if (!actx) return;
  const now = actx.currentTime;
  [0, 0.25, 0.5, 0.75].forEach(delay => {
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(delay % 0.5 === 0 ? 950 : 1250, now + delay);
    g.gain.setValueAtTime(0.5, now + delay);
    g.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.2);
    o.connect(g);
    g.connect(actx.destination);
    o.start(now + delay);
    o.stop(now + delay + 0.2);
  });
}

function money(n) { return '₹' + Number(n || 0).toFixed(2); }
function uid(p) { return p + '_' + Math.random().toString(36).slice(2, 9); }
function toast(msg, icon) {
  const host = document.getElementById('toastHost'); if (!host) return;
  const el = document.createElement('div');
  el.className = 'modal-fade pointer-events-auto bg-brand-900 text-cream px-4 py-2.5 rounded-full shadow-lg text-sm font-medium flex items-center gap-2';
  el.innerHTML = `<i data-lucide="${icon || 'check-circle'}" class="w-4 h-4 text-gold-400"></i><span>${msg}</span>`;
  host.appendChild(el); lucide.createIcons();
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2600);
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return s + 's ago';
  const m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60); return h + 'h ago';
}

function formatDuration(ms) {
  if (!ms || ms < 0) return '—';
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}m ${s}s`;
}

function formatTime(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function calculateOrderTotal(order) {
  const cafeSub = (order.items || []).filter(i => i.kind === 'cafe' || (!i.kind && order.type === 'cafe')).reduce((a, b) => a + (b.price * b.qty), 0);
  const retailSub = (order.items || []).filter(i => i.kind === 'retail' || (!i.kind && order.type === 'retail')).reduce((a, b) => a + (b.price * b.qty), 0);
  return cafeSub + (cafeSub * 0.05) + retailSub;
}

function calculateBaseRecipeCostPerUnit(base) {
  if (!base || !base.ingredients) return 0;
  const totalBatchCost = base.ingredients.reduce((sum, ing) => sum + (Number(ing.qty || 0) * Number(ing.unitPrice || 0)), 0);
  const yieldQty = Number(base.batchYield || 1);
  return yieldQty > 0 ? (totalBatchCost / yieldQty) : 0;
}

    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    const found = DB.staff.find(s => s.username === u && s.password === p);
    const err = document.getElementById('loginError');
    if (found) {
      session.staff = found;
      localStorage.setItem('ps_staff', JSON.stringify(found));
      session.kitchenTab = 'orders'; 
      render(); 
      toast('Welcome back, ' + found.username, 'log-in');

      err.classList.remove('hidden');
    }
  };

/* RECIPE COSTING MODULE */
function recipeCostingPanel() {
  const selectedDish = DB.menu.find(m => m.id === session.activeRecipeDishId);
  const activeRecipe = session.activeRecipeDishId ? (DB.recipes[session.activeRecipeDishId] || { portions: 1, wastagePercent: 10, ingredients: [] }) : null;

  let rawTotalCost = 0;
  if (activeRecipe) {
    rawTotalCost = (activeRecipe.ingredients || []).reduce((sum, ing) => sum + (Number(ing.qty || 0) * Number(ing.unitPrice || 0)), 0);
  }
  
  const wastageCost = rawTotalCost * ((activeRecipe?.wastagePercent || 10) / 100);
  const totalProductionCost = rawTotalCost + wastageCost;
  const costPerPortion = activeRecipe?.portions ? (totalProductionCost / activeRecipe.portions) : 0;

  const sellingPrice = selectedDish ? Number(selectedDish.price || 0) : 0;

function renderKeepFocus(id) {
  const el = document.activeElement; 
  const pos = el && el.selectionStart; 
  render();
  const el2 = document.getElementById(id); 
  if (el2) { 
    el2.focus(); 
    if (pos != null) el2.setSelectionRange(pos, pos); 
  }
}

function wireKitchen() {
  document.getElementById('logoutBtn').onclick = () => { 
    localStorage.removeItem('ps_staff');
    session.staff = null; 
    render(); 
  };
  document.getElementById('soundToggle').onclick = () => { unlockAudio(); session.soundOn = !session.soundOn; render(); };
  document.querySelectorAll('.k-tab').forEach(b => b.onclick = () => { session.kitchenTab = b.dataset.ktab; render(); });

  const dashCafe = document.getElementById('dashCafeSearch');
  if (dashCafe) dashCafe.oninput = (e) => { session.cafeSearch = e.target.value; renderKeepFocus('dashCafeSearch'); };

  const dashRetail = document.getElementById('dashRetailSearch');
  if (dashRetail) dashRetail.oninput = (e) => { session.retailSearch = e.target.value; renderKeepFocus('dashRetailSearch'); };

  const dashRm = document.getElementById('dashRmSearch');
  if (dashRm) dashRm.oninput = (e) => { session.rmSearch = e.target.value; renderKeepFocus('dashRmSearch'); };

  /* BULK MAIN RECIPE UPLOADER HANDLERS */
  const dlMainRecipesBtn = document.getElementById('dlMainRecipesTemplateBtn');
  if (dlMainRecipesBtn) {
    dlMainRecipesBtn.onclick = () => downloadMainRecipesTemplate();
  }

  const triggerMainRecipeExcelBtn = document.getElementById('triggerMainRecipeExcelBtn');
  const mainRecipeExcelInput = document.getElementById('mainRecipeExcelInput');
  if (triggerMainRecipeExcelBtn && mainRecipeExcelInput) {
    triggerMainRecipeExcelBtn.onclick = () => mainRecipeExcelInput.click();
    
    mainRecipeExcelInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (evt) => {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const json = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName]);

          const grouped = {};
          json.forEach(row => {
            const dName = (row.dishName || row.dish_name || '').toString().trim();
            if (!dName) return;

            const dish = DB.menu.find(m => m.name.toLowerCase().trim() === dName.toLowerCase());
            const dishId = dish ? dish.id : uid('m_custom');

            if (!grouped[dishId]) {
              grouped[dishId] = {
                portions: Number(row.portions) || 1,
                wastagePercent: Number(row.wastagePercent || row.wastage) || 10,
                ingredients: []
              };
            }

            const ingName = (row.ingredientName || row.ingredient || '').toString().trim();
            const rm = DB.rawMaterials.find(r => r.name.toLowerCase().trim() === ingName.toLowerCase());
            const br = DB.baseRecipes.find(b => b.name.toLowerCase().trim() === ingName.toLowerCase());

            let unitPrice = 0;
            let unit = 'kg';

            if (rm) {
              unitPrice = rm.unitPrice;
              unit = rm.unit;
            } else if (br) {
              unitPrice = calculateBaseRecipeCostPerUnit(br);
              unit = br.unit;
            }

            grouped[dishId].ingredients.push({
              name: ingName,
              qty: Number(row.qty) || 1,
              unit: unit,
              unitPrice: unitPrice
            });
          });

          for (const dishId in grouped) {
            await db.ref('recipes/' + dishId).set(grouped[dishId]);
          }

          toast(`Bulk main dish recipes updated for ${Object.keys(grouped).length} dishes!`, 'check-circle');
        } catch (err) {
          toast('Error parsing main recipes Excel file.', 'alert-triangle');
        }
      };
      reader.readAsArrayBuffer(file);
    };
  }

  /* BULK BASE RECIPE UPLOADER HANDLERS */
  const dlBaseRecipesBtn = document.getElementById('dlBaseRecipesTemplateBtn');
  if (dlBaseRecipesBtn) {
    dlBaseRecipesBtn.onclick = () => downloadBaseRecipesTemplate();
  }

  const triggerBaseRecipeExcelBtn = document.getElementById('triggerBaseRecipeExcelBtn');
  const baseRecipeExcelInput = document.getElementById('baseRecipeExcelInput');
  if (triggerBaseRecipeExcelBtn && baseRecipeExcelInput) {
    triggerBaseRecipeExcelBtn.onclick = () => baseRecipeExcelInput.click();

    baseRecipeExcelInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (evt) => {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);

          const grouped = {};
          json.forEach(row => {
            const rName = (row.recipeName || row.name || '').toString().trim();
            if (!rName) return;

            let existing = DB.baseRecipes.find(b => b.name.toLowerCase().trim() === rName.toLowerCase());
            const baseId = existing ? existing.id : uid('br');

            if (!grouped[baseId]) {
              grouped[baseId] = {
                id: baseId,
                name: rName,
                batchYield: Number(row.batchYield || row.yield) || 1,
                unit: (row.unit || 'kg').toString().trim().toLowerCase(),
                ingredients: []
              };
            }

            const ingName = (row.ingredientName || row.ingredient || '').toString().trim();
            const rm = DB.rawMaterials.find(r => r.name.toLowerCase().trim() === ingName.toLowerCase());

            grouped[baseId].ingredients.push({
              name: ingName,
              qty: Number(row.qty) || 1,
              unit: rm ? rm.unit : 'kg',
              unitPrice: rm ? rm.unitPrice : 0
            });
          });

          for (const baseId in grouped) {
            await db.ref('baseRecipes/' + baseId).set(grouped[baseId]);
          }

          toast(`Bulk base recipes updated for ${Object.keys(grouped).length} preps!`, 'check-circle');
        } catch (err) {
          toast('Error parsing base recipes Excel file.', 'alert-triangle');
        }
      };
      reader.readAsArrayBuffer(file);
    };
  }

  /* RAW MATERIAL MASTER MODAL HANDLERS */
  const manageIngBtn = document.getElementById('manageIngredientsBtn');
  if (manageIngBtn) {
    manageIngBtn.onclick = () => {
      session.showRawMaterialsModal = true;
      render();
    };
  }

  const closeRmBtn = document.getElementById('closeRawMaterialsBtn');
  if (closeRmBtn) {
    closeRmBtn.onclick = () => {
      session.showRawMaterialsModal = false;
      render();
    };
  }

  const dlRmTemplateBtn = document.getElementById('dlRmTemplateBtn');
  if (dlRmTemplateBtn) {
    dlRmTemplateBtn.onclick = () => downloadRawMaterialsTemplate();
  }

  const processRmExcelBtn = document.getElementById('processRmExcelBtn');
  if (processRmExcelBtn) {
    processRmExcelBtn.onclick = () => {
      const fileInput = document.getElementById('rmExcelInput');
      if (!fileInput || !fileInput.files[0]) {
        toast('Please select an Excel or CSV file first.', 'alert-triangle');
        return;
      }

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const json = XLSX.utils.sheet_to_json(worksheet);

          if (!json.length) {
            toast('The selected file is empty.', 'alert-triangle');
            return;
          }

          let addedCount = 0;
          for (const row of json) {
            if (row.name) {
              const id = uid('rm');
              await db.ref('rawMaterials/' + id).set({
                id,
                name: row.name.toString().trim(),
                vendor: (row.vendor || 'General Supplier').toString().trim(),
                unit: (row.unit || 'kg').toString().trim().toLowerCase(),
                unitPrice: Number(row.unitPrice || row.price || 0)
              });
              addedCount++;
            }
          }

          toast(`Successfully added ${addedCount} raw materials!`, 'check-circle');
        } catch (err) {
          toast('Error reading Excel file. Check column headers.', 'alert-triangle');
        }
      };
      reader.readAsArrayBuffer(fileInput.files[0]);
    };
  }

  const addRmBtn = document.getElementById('addRmBtn');
  if (addRmBtn) {
    addRmBtn.onclick = async () => {
      const name = document.getElementById('newRmName').value.trim();
      const vendor = document.getElementById('newRmVendor').value.trim() || 'General Supplier';
      const unit = document.getElementById('newRmUnit').value;
      const unitPrice = Number(document.getElementById('newRmPrice').value) || 0;

      if (!name) { toast('Please enter a raw material name.', 'alert-triangle'); return; }

      const newItem = { id: uid('rm'), name, vendor, unit, unitPrice };
      await db.ref('rawMaterials/' + newItem.id).set(newItem);
      toast('Raw material added to master list!', 'check-circle');
    };
  }

  document.querySelectorAll('.delete-rm-btn').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      await db.ref('rawMaterials/' + id).remove();
      toast('Raw material removed.');
    };
  });

  /* BASE RECIPES MASTER HANDLERS */
  const manageBaseBtn = document.getElementById('manageBaseRecipesBtn');
  if (manageBaseBtn) {
    manageBaseBtn.onclick = () => {
      session.showBaseRecipesModal = true;
      if (!session.editingBaseRecipeId && DB.baseRecipes.length > 0) {
        session.editingBaseRecipeId = DB.baseRecipes[0].id;
      }
      render();
    };
  }

  const closeBaseBtn = document.getElementById('closeBaseRecipesBtn');
  if (closeBaseBtn) {
    closeBaseBtn.onclick = () => {
      session.showBaseRecipesModal = false;
      render();
    };
  }

  const createNewBaseBtn = document.getElementById('createNewBaseRecipeBtn');
  if (createNewBaseBtn) {
    createNewBaseBtn.onclick = async () => {
      const newBase = {
        id: uid('br'),
        name: 'New Base Prep',
        batchYield: 1,
        unit: 'kg',
        ingredients: []
      };
      await db.ref('baseRecipes/' + newBase.id).set(newBase);
      session.editingBaseRecipeId = newBase.id;
      render();
    };
  }

  document.querySelectorAll('.base-recipe-card').forEach(card => {
    card.onclick = () => {
      session.editingBaseRecipeId = card.dataset.id;
      render();
    };
  });

  const saveBaseRecipeBtn = document.getElementById('saveBaseRecipeBtn');
  if (saveBaseRecipeBtn && session.editingBaseRecipeId) {
    saveBaseRecipeBtn.onclick = async () => {
      const activeBase = DB.baseRecipes.find(b => b.id === session.editingBaseRecipeId);
      if (activeBase) {
        activeBase.name = document.getElementById('baseName').value.trim();
        activeBase.batchYield = Number(document.getElementById('baseYield').value) || 1;
        activeBase.unit = document.getElementById('baseUnit').value;

        await db.ref('baseRecipes/' + activeBase.id).set(activeBase);
        toast('Base recipe saved!', 'check-circle');
      }
    };
  }

  const deleteBaseRecipeBtn = document.getElementById('deleteBaseRecipeBtn');
  if (deleteBaseRecipeBtn && session.editingBaseRecipeId) {
    deleteBaseRecipeBtn.onclick = async () => {
      if (confirm('Delete this base recipe?')) {
        await db.ref('baseRecipes/' + session.editingBaseRecipeId).remove();
        session.editingBaseRecipeId = null;
        render();
        toast('Base recipe removed.');
      }
    };
  }

  const addBaseIngRowBtn = document.getElementById('addBaseIngRowBtn');
  if (addBaseIngRowBtn && session.editingBaseRecipeId) {
    addBaseIngRowBtn.onclick = () => {
      const activeBase = DB.baseRecipes.find(b => b.id === session.editingBaseRecipeId);
      if (activeBase) {
        if (!activeBase.ingredients) activeBase.ingredients = [];
        activeBase.ingredients.push({ name: '', qty: 1, unit: 'kg', unitPrice: 0 });
        render();
      }
    };
  }

  document.querySelectorAll('.base-ing-select').forEach(select => {
    select.onchange = (e) => {
      const idx = Number(select.dataset.idx);
      const activeBase = DB.baseRecipes.find(b => b.id === session.editingBaseRecipeId);
      const selectedRm = DB.rawMaterials.find(r => r.name === e.target.value);
      if (activeBase && selectedRm) {
        activeBase.ingredients[idx].name = selectedRm.name;
        activeBase.ingredients[idx].unit = selectedRm.unit;
        activeBase.ingredients[idx].unitPrice = selectedRm.unitPrice;
        render();
      }
    };
  });

  document.querySelectorAll('.base-ing-qty').forEach(input => {
    input.onchange = (e) => {
      const idx = Number(input.dataset.idx);
      const activeBase = DB.baseRecipes.find(b => b.id === session.editingBaseRecipeId);
      if (activeBase && activeBase.ingredients[idx]) {
        activeBase.ingredients[idx].qty = Number(e.target.value) || 0;
        render();
      }
    };
  });

  document.querySelectorAll('.remove-base-ing').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.idx);
      const activeBase = DB.baseRecipes.find(b => b.id === session.editingBaseRecipeId);
      if (activeBase) {
        activeBase.ingredients.splice(idx, 1);
        render();
      }
    };
  });

  /* RECIPE COSTING HANDLERS */
  const costingDishSelect = document.getElementById('costingDishSelect');
  if (costingDishSelect) {
    costingDishSelect.onchange = (e) => {
      session.activeRecipeDishId = e.target.value;
      render();
    };
  }

  const recipePortionsInput = document.getElementById('recipePortions');
  if (recipePortionsInput) {
    recipePortionsInput.onchange = (e) => {
      if (session.activeRecipeDishId) {
        if (!DB.recipes[session.activeRecipeDishId]) DB.recipes[session.activeRecipeDishId] = { portions: 1, wastagePercent: 10, ingredients: [] };
        DB.recipes[session.activeRecipeDishId].portions = Number(e.target.value) || 1;
        render();
      }
    };
  }

  const recipeWastageInput = document.getElementById('recipeWastage');
  if (recipeWastageInput) {
    recipeWastageInput.onchange = (e) => {
      if (session.activeRecipeDishId) {
        if (!DB.recipes[session.activeRecipeDishId]) DB.recipes[session.activeRecipeDishId] = { portions: 1, wastagePercent: 10, ingredients: [] };
        DB.recipes[session.activeRecipeDishId].wastagePercent = Number(e.target.value) || 0;
        render();
      }
    };
  }

  const addIngredientRowBtn = document.getElementById('addIngredientRowBtn');
  if (addIngredientRowBtn) {
    addIngredientRowBtn.onclick = () => {
      if (session.activeRecipeDishId) {
        if (!DB.recipes[session.activeRecipeDishId]) DB.recipes[session.activeRecipeDishId] = { portions: 1, wastagePercent: 10, ingredients: [] };
        DB.recipes[session.activeRecipeDishId].ingredients.push({ name: '', qty: 1, unit: 'kg', unitPrice: 0 });
        render();
      }
    };
  }

  document.querySelectorAll('.ing-master-select').forEach(select => {
    select.onchange = (e) => {
      const idx = Number(select.dataset.idx);
      const val = e.target.value;
      
      if (session.activeRecipeDishId && DB.recipes[session.activeRecipeDishId]) {
        if (val.startsWith('rm_')) {
          const name = val.replace('rm_', '');
          const rm = DB.rawMaterials.find(r => r.name === name);
          if (rm) {
            DB.recipes[session.activeRecipeDishId].ingredients[idx].name = rm.name;
            DB.recipes[session.activeRecipeDishId].ingredients[idx].unit = rm.unit;
            DB.recipes[session.activeRecipeDishId].ingredients[idx].unitPrice = rm.unitPrice;
          }
        } else if (val.startsWith('br_')) {
          const name = val.replace('br_', '');
          const br = DB.baseRecipes.find(b => b.name === name);
          if (br) {
            DB.recipes[session.activeRecipeDishId].ingredients[idx].name = br.name;
            DB.recipes[session.activeRecipeDishId].ingredients[idx].unit = br.unit;
            DB.recipes[session.activeRecipeDishId].ingredients[idx].unitPrice = calculateBaseRecipeCostPerUnit(br);
          }
        }
        render();
      }
    };
  });

  document.querySelectorAll('.remove-ing-row').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.idx);
      if (session.activeRecipeDishId && DB.recipes[session.activeRecipeDishId]) {
        DB.recipes[session.activeRecipeDishId].ingredients.splice(idx, 1);
        render();
      }
    };
  });

  document.querySelectorAll('.ing-qty').forEach(input => {
    input.onchange = (e) => {
      const idx = Number(input.dataset.idx);
      if (session.activeRecipeDishId && DB.recipes[session.activeRecipeDishId]) {
        DB.recipes[session.activeRecipeDishId].ingredients[idx].qty = Number(e.target.value) || 0;
        render();
      }
    };
  });

  document.querySelectorAll('.ing-price').forEach(input => {
    input.onchange = (e) => {
      const idx = Number(input.dataset.idx);
      if (session.activeRecipeDishId && DB.recipes[session.activeRecipeDishId]) {
        DB.recipes[session.activeRecipeDishId].ingredients[idx].unitPrice = Number(e.target.value) || 0;
        render();
      }
    };
  });

  const saveRecipeBtn = document.getElementById('saveRecipeBtn');
  if (saveRecipeBtn) {
    saveRecipeBtn.onclick = async () => {
      if (session.activeRecipeDishId && DB.recipes[session.activeRecipeDishId]) {
        await db.ref('recipes/' + session.activeRecipeDishId).set(DB.recipes[session.activeRecipeDishId]);
        toast('Recipe cost breakdown saved cloud-wide!', 'check-circle');
      }
    };
  }

  document.querySelectorAll('.advance-order').forEach(b => b.onclick = async () => {
    const o = DB.orders.find(x => x.id === b.dataset.id);
    if (o) {
      const nextStatus = b.dataset.next;
      const updates = { status: nextStatus };
      if (nextStatus === 'served') {
        updates.completedTs = Date.now();
      }
      await db.ref('orders/' + o.id).update(updates);
      render();
    }
  });

  document.querySelectorAll('.stock-toggle').forEach(b => b.onclick = async () => {
    const kind = b.dataset.kind;
    const arr = kind === 'menu' ? DB.menu : DB.retail;
    const it = arr.find(x => x.id === b.dataset.id);
    it.stock = !it.stock;
    await db.ref(`${kind}/${it.id}`).update({ stock: it.stock });
    render(); toast(it.name + ' marked ' + (it.stock ? 'in stock' : 'out of stock'), it.stock ? 'check-circle' : 'ban');
  });

  document.querySelectorAll('.edit-item').forEach(b => b.onclick = () => {
    if (b.dataset.kind === 'menu') session.editingDish = b.dataset.id; else session.editingRetail = b.dataset.id;
    render();
  });

  document.querySelectorAll('.delete-item').forEach(b => b.onclick = async () => {
    if (!confirm('Remove this item?')) return;
    const kind = b.dataset.kind;
    await db.ref(`${kind}/${b.dataset.id}`).remove();
    render();
  });

  const addDish = document.getElementById('addDishBtn'); if (addDish) addDish.onclick = () => { session.editingDish = 'new'; render(); };
  const addRetail = document.getElementById('addRetailBtn'); if (addRetail) addRetail.onclick = () => { session.editingRetail = 'new'; render(); };

  const saveDish = document.getElementById('saveDishBtn');
  if (saveDish) saveDish.onclick = async () => {
    const badges = Array.from(document.querySelectorAll('.dBadge:checked')).map(c => c.value);
    const fileInput = document.getElementById('dImgFile');
    const existing = saveDish.dataset.id ? DB.menu.find(m => m.id === saveDish.dataset.id) : null;
    let imgData = existing ? existing.img : '';

    if (fileInput && fileInput.files[0]) {
      toast('Compressing and saving photo...', 'image');
      imgData = await compressAndGetBase64(fileInput.files[0]);
    }

    const payload = {
      id: saveDish.dataset.id || uid('m'),
      name: document.getElementById('dName').value.trim(),
      category: document.getElementById('dCategory').value.trim(),
      price: Number(document.getElementById('dPrice').value) || 0,
      img: imgData,
      desc: document.getElementById('dDesc').value.trim(),
      badges, stock: true,
      nutrition: { cal: Number(document.getElementById('dCal').value) || 0, protein: Number(document.getElementById('dProt').value) || 0, carbs: Number(document.getElementById('dCarb').value) || 0, fat: Number(document.getElementById('dFat').value) || 0 }
    };
    if (!payload.name) { toast('Please enter a dish name.', 'alert-triangle'); return; }

    await db.ref('menu/' + payload.id).set(payload);
    session.editingDish = null; render(); toast('Dish saved cloud-wide!');
  };

  const saveRetail = document.getElementById('saveRetailBtn');
  if (saveRetail) saveRetail.onclick = async () => {
    const fileInput = document.getElementById('rImgFile');
    const existing = saveRetail.dataset.id ? DB.retail.find(m => m.id === saveRetail.dataset.id) : null;
    let imgData = existing ? existing.img : '';

    if (fileInput && fileInput.files[0]) {
      toast('Compressing and saving photo...', 'image');
      imgData = await compressAndGetBase64(fileInput.files[0]);
    }

    const payload = {
      id: saveRetail.dataset.id || uid('r'),
      name: document.getElementById('rName').value.trim(),
      category: document.getElementById('rCategory').value.trim(),
      price: Number(document.getElementById('rPrice').value) || 0,
      size: document.getElementById('rSize').value.trim(),
      img: imgData,
      desc: document.getElementById('rDesc').value.trim(),
      badges: ['100% Organic'],
      stock: true
    };
    if (!payload.name) { toast('Please enter a product name.', 'alert-triangle'); return; }

    await db.ref('retail/' + payload.id).set(payload);
    session.editingRetail = null; render(); toast('Product saved cloud-wide!');
  };
}

db.ref('menu').on('value', snap => {
  const data = snap.val();
  DB.menu = data ? Object.values(data) : [];
  if (session.editingDish === null) render();
});

db.ref('retail').on('value', snap => {
  const data = snap.val();
  DB.retail = data ? Object.values(data) : [];
  if (session.editingRetail === null) render();
});

db.ref('orders').on('value', snap => {
  const data = snap.val();
  DB.orders = data ? Object.values(data) : [];
  render();
});

db.ref('rawMaterials').on('value', snap => {
  const data = snap.val();
  DB.rawMaterials = data ? Object.values(data) : [];
  render();
});

db.ref('baseRecipes').on('value', snap => {
  const data = snap.val();
  DB.baseRecipes = data ? Object.values(data) : [];
  render();
});

db.ref('recipes').on('value', snap => {
  const data = snap.val();
  DB.recipes = data || {};
  render();
});

db.ref('settings').on('value', snap => {
  const data = snap.val();
  if (data) { DB.settings = data; render(); }
});

(function boot() {
  document.addEventListener('touchstart', unlockAudio, { once: true });
  document.addEventListener('click', unlockAudio, { once: true });
  render();
})();
</script>
</body>
</html>
