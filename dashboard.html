function compressAndGetBase64(file, maxWidth = 600, maxHeight = 600, quality = 0.7) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve('');
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > height) {
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
        } else {
          if (height > maxHeight) {
            width = Math.round((width * maxHeight) / height);
            height = maxHeight;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = (err) => reject(err);
    };
    reader.onerror = (err) => reject(err);
  });
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return s + 's ago';
  const m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60); return h + 'h ago';
}

function formatDuration(ms) {
  if (!ms || ms < 0) return '—';
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}m ${s}s`;
}

function formatTime(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function calculateOrderTotal(order) {
  const items = order.items || [];
  const sub = items.reduce((a, b) => a + (b.price * b.qty), 0);
  return sub + (sub * 0.05);
}

function getRawMaterialDetails(name) {
  if (!name) return { unitPrice: 0, vendor: 'FACTORY', unit: 'GRM' };
  const cleanName = name.toLowerCase().trim();
  const found = DB.rawMaterials.find(r => (r.name || '').toLowerCase().trim() === cleanName);
  return found || { unitPrice: 0, vendor: 'FACTORY', unit: 'GRM' };
}

function calculateIngCost(ing) {
  const qty = Number(ing.qty || 0);
  const unit = (ing.unit || 'GRM').toUpperCase();

  if (ing.type === 'base' || ing.isBase) {
    const baseObj = DB.baseRecipes.find(b => (b.name || '').toLowerCase().trim() === (ing.name || '').toLowerCase().trim());
    if (baseObj) {
      const unitRate = calculateBaseRecipeCostPerUnit(baseObj);
      const gramsMl = Number(ing.gramsMl || getConvertedGramsMl(qty, unit));
      return (gramsMl / 1000) * unitRate;
    }
  }

  let rate = Number(ing.unitPrice || 0);
  if (!rate && ing.name) {
    rate = getRawMaterialDetails(ing.name).unitPrice;
  }

  let gramsMl = Number(ing.gramsMl || 0);

  if (!gramsMl) {
    switch(unit) {
      case 'KG':
      case 'LITRE': gramsMl = qty * 1000; break;
      case 'TSP': gramsMl = qty * 5; break;
      case 'TBSP': gramsMl = qty * 15; break;
      case 'GRM':
      case 'ML':
      case 'G':
      case 'PCS':
      case 'NOS':
      default: gramsMl = qty; break;
    }
  }

  return (gramsMl / 1000) * rate;
}

function getConvertedGramsMl(qty, unit) {
  const q = Number(qty || 0);
  const u = (unit || 'GRM').toUpperCase();
  switch(u) {
    case 'KG':
    case 'LITRE': return q * 1000;
    case 'TSP': return q * 5;
    case 'TBSP': return q * 15;
    case 'GRM':
    case 'ML':
    case 'PCS':
    case 'NOS':
    default: return q;
  }
}

function calculateBaseRecipeCostPerUnit(base) {
  if (!base || !base.ingredients) return 0;
  const totalBatchCost = base.ingredients.reduce((sum, ing) => sum + calculateIngCost(ing), 0);
  const yieldQty = Number(base.batchYield || 1);
  return yieldQty > 0 ? (totalBatchCost / yieldQty) : 0;
}

function getDishFoodCostPercent(dish) {
  const recipe = DB.recipes[dish.id];
  if (!recipe || !recipe.ingredients) return 0;
  const rawTotal = (recipe.ingredients || []).reduce((sum, ing) => sum + calculateIngCost(ing), 0);
  const wastage = rawTotal * ((recipe.wastagePercent || 10) / 100);
  const totalCost = rawTotal + wastage;
  const portionCost = recipe.portions ? (totalCost / recipe.portions) : 0;
  const price = Number(dish.price || 0);
  return price > 0 ? (portionCost / price) * 100 : 0;
}

async function processBOMDeduction(dishId, orderedPortions = 1) {
  const recipe = DB.recipes[dishId];
  if (!recipe || !recipe.ingredients) return;

  const updates = {};

  function cascadeIngredient(ing, multiplier) {
    if (ing.type === 'base' || ing.isBase) {
      const baseObj = DB.baseRecipes.find(b => (b.name || '').toLowerCase().trim() === (ing.name || '').toLowerCase().trim());
      if (baseObj && baseObj.ingredients) {
        const baseUsageGrams = Number(ing.gramsMl || getConvertedGramsMl(ing.qty, ing.unit)) * multiplier;
        const baseYieldGrams = Number(baseObj.batchYield || 1);
        const batchFraction = baseYieldGrams > 0 ? (baseUsageGrams / baseYieldGrams) : 0;

        baseObj.ingredients.forEach(subIng => {
          cascadeIngredient(subIng, batchFraction);
        });
      }
    } else {
      const rm = DB.rawMaterials.find(r => (r.name || '').toLowerCase().trim() === (ing.name || '').toLowerCase().trim());
      if (rm) {
        const requiredGrams = Number(ing.gramsMl || getConvertedGramsMl(ing.qty, ing.unit)) * multiplier;
        const currentStock = Number(rm.stockGrams ?? 100000);
        const newStock = Math.max(0, currentStock - requiredGrams);
        updates[`rawMaterials/${rm.id}/stockGrams`] = newStock;
      }
    }
  }

  recipe.ingredients.forEach(ing => cascadeIngredient(ing, orderedPortions));

  if (Object.keys(updates).length > 0) {
    await db.ref().update(updates);
  }
}

function exportBillWiseReportToExcel() {
  const completedOrders = [...DB.orders].filter(o => o.status === 'served');
  const data = completedOrders.map(o => ({
    "Order ID": o.id,
    "Date": new Date(o.ts).toLocaleDateString(),
    "Time": new Date(o.ts).toLocaleTimeString(),
    "Table No": o.table,
    "Billing Type": (o.type === 'qr' ? 'QR Table Billing' : 'Manual Counter Billing'),
    "Customer Name": o.customerName || 'Guest',
    "Phone": o.customerPhone || 'N/A',
    "Payment Mode": o.paymentMode || 'UPI',
    "Subtotal (₹)": (o.items || []).reduce((acc, i) => acc + (i.price * i.qty), 0).toFixed(2),
    "Tax / Charges (5%)": ((o.items || []).reduce((acc, i) => acc + (i.price * i.qty), 0) * 0.05).toFixed(2),
    "Total Billed (₹)": calculateOrderTotal(o).toFixed(2)
  }));

  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Bill-Wise Sales Report");
  XLSX.writeFile(wb, "BillWise_Sales_Report.xlsx");
  toast("Bill-Wise Report downloaded successfully!", "file-spreadsheet");
}

function exportItemWiseReportToExcel() {
  const itemSales = {};
  DB.orders.filter(o => o.status === 'served').forEach(o => {
    (o.items || []).forEach(i => {
      if (!itemSales[i.name]) itemSales[i.name] = { category: i.kind || 'cafe', qty: 0, revenue: 0 };
      itemSales[i.name].qty += Number(i.qty || 1);
      itemSales[i.name].revenue += Number(i.price || 0) * Number(i.qty || 1);
    });
  });

  const data = Object.entries(itemSales).map(([name, info]) => ({
    "Item Name": name,
    "Category": info.category.toUpperCase(),
    "Total Units Sold": info.qty,
    "Total Revenue (₹)": info.revenue.toFixed(2)
  }));

  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Item-Wise Sales Report");
  XLSX.writeFile(wb, "ItemWise_Sales_Report.xlsx");
  toast("Item-Wise Report downloaded successfully!", "file-spreadsheet");
}

function exportMonthlyStockReconciliationToExcel() {
  const data = DB.rawMaterials.map(rm => {
    const openingQty = Number(rm.openingQty || 10);
    const openingVal = Number(rm.openingValue || 2000);
    const purchaseQty = DB.purchases.filter(p => p.itemName === rm.name).reduce((sum, p) => sum + Number(p.qty), 0);
    const purchaseVal = DB.purchases.filter(p => p.itemName === rm.name).reduce((sum, p) => sum + Number(p.totalAmount), 0);
    const soldQty = 5;
    const soldVal = soldQty * Number(rm.unitPrice || 100);
    const wasteQty = DB.wastageLogs.filter(w => w.item === rm.name).reduce((sum, w) => sum + Number(w.qty), 0);
    const wasteVal = wasteQty * Number(rm.unitPrice || 100);
    const closingQty = Math.max(0, openingQty + purchaseQty - soldQty - wasteQty);
    const closingVal = closingQty * Number(rm.unitPrice || 100);

    return {
      "Item Name": rm.name,
      "Opening Qty": openingQty,
      "Opening Value (₹)": openingVal,
      "Purchase Qty": purchaseQty,
      "Purchase Value (₹)": purchaseVal,
      "Sold / Consumed Qty": soldQty,
      "Sold / Consumed Value (₹)": soldVal,
      "Waste Qty": wasteQty,
      "Waste Value (₹)": wasteVal,
      "Closing Qty": closingQty,
      "Closing Value (₹)": closingVal
    };
  });

  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Monthly Stock Reconciliation");
  XLSX.writeFile(wb, "Monthly_Stock_Reconciliation.xlsx");
  toast("Monthly Stock Reconciliation downloaded!", "file-spreadsheet");
}

      unlockAudio();
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value;
      const found = DB.staff.find(s => s.username === u && s.password === p);
      const err = document.getElementById('loginError');
      if (found) {
        session.staff = found;
        localStorage.setItem('ps_staff', JSON.stringify(found));
        session.kitchenTab = 'orders'; 
        render();

      } else {
        if (err) {
          err.textContent = 'Incorrect username or password.'; 
          err.classList.remove('hidden');
        }
      }
    };
  }
}

function menuEngineeringPanel() {
  const menuItems = DB.menu;
  let totalSoldUnits = 0;
  const itemCounts = {};
  DB.orders.filter(o => o.status === 'served').forEach(o => {
    (o.items || []).forEach(i => {
      itemCounts[i.name] = (itemCounts[i.name] || 0) + Number(i.qty || 1);
      totalSoldUnits += Number(i.qty || 1);
    });
  });

  const avgPopularity = menuItems.length > 0 ? totalSoldUnits / menuItems.length : 0;

  const categorized = menuItems.map(m => {
    const sold = itemCounts[m.name] || 0;
    const foodCostPct = getDishFoodCostPercent(m);
    const grossMargin = 100 - foodCostPct;
    
    let classification = 'Dog 🐶';
    let color = 'bg-red-50 text-red-800 border-red-200';

    const isPopular = sold >= avgPopularity;
    const isProfitable = grossMargin >= 65;

    if (isPopular && isProfitable) {
      classification = 'Star ⭐';
      color = 'bg-green-50 text-green-800 border-green-200';
    } else if (isPopular && !isProfitable) {
      classification = 'Plowhorse 🐴';
      color = 'bg-amber-50 text-amber-800 border-amber-200';
    } else if (!isPopular && isProfitable) {
      classification = 'Puzzle 🧩';
      color = 'bg-blue-50 text-blue-800 border-blue-200';
    }

    return { name: m.name, category: m.category, price: m.price, sold, grossMargin: grossMargin.toFixed(1), classification, color };
  });

  return `
  <div class="space-y-5">
    <div class="bg-white rounded-2xl card-shadow p-5">
      <h3 class="font-display text-lg font-bold text-brand-950 mb-1">Menu Engineering Matrix</h3>
      <p class="text-xs text-brand-400 mb-4">Automatically categorizes your menu items into Stars, Plowhorses, Puzzles, and Dogs.</p>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
        <div class="bg-green-50/60 p-4 rounded-xl border border-green-200">
          <div class="text-xs font-bold text-green-800">Stars ⭐</div>
          <div class="text-[11px] text-green-600 mt-0.5">High Profit &amp; High Popularity.</div>
        </div>
        <div class="bg-amber-50/60 p-4 rounded-xl border border-amber-200">
          <div class="text-xs font-bold text-amber-800">Plowhorses 🐴</div>
          <div class="text-[11px] text-amber-600 mt-0.5">Low Profit &amp; High Popularity.</div>
        </div>
        <div class="bg-blue-50/60 p-4 rounded-xl border border-blue-200">
          <div class="text-xs font-bold text-blue-800">Puzzle 🧩</div>
          <div class="text-[11px] text-blue-600 mt-0.5">High Profit &amp; Low Popularity.</div>
        </div>
        <div class="bg-red-50/60 p-4 rounded-xl border border-red-200">
          <div class="text-xs font-bold text-red-800">Dogs 🐶</div>
          <div class="text-[11px] text-red-600 mt-0.5">Low Profit &amp; Low Popularity.</div>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs min-w-[650px]">
          <thead class="bg-brand-50 text-brand-800 uppercase font-bold text-[10px]">
            <tr>
              <th class="p-3">Dish Name</th>
              <th class="p-3">Category</th>
              <th class="p-3 text-center">Units Sold</th>
              <th class="p-3 text-right">Gross Margin %</th>
              <th class="p-3 text-center">Classification</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-brand-50 font-medium">
            ${categorized.map(item => `
              <tr class="hover:bg-brand-50/40">
                <td class="p-3 font-bold text-brand-950">${item.name}</td>
                <td class="p-3 text-brand-500">${item.category}</td>

            `).join('') || `<tr><td colspan="5" class="text-center py-8 text-brand-400">No menu items available.</td></tr>`}
          </tbody>

function wireKitchen() {

      localStorage.removeItem('ps_staff');
      session.staff = null; 
      render(); 
    };
  }

  const soundToggle = document.getElementById('soundToggle');
  if (soundToggle) {
    soundToggle.onclick = () => { unlockAudio(); session.soundOn = !session.soundOn; render(); };
  }

  document.querySelectorAll('.k-tab').forEach(b => {
    b.onclick = () => { 
      session.kitchenTab = b.dataset.ktab; 
      render(); 
    };
  });

  const dashCafe = document.getElementById('dashCafeSearch');
  if (dashCafe) dashCafe.oninput = (e) => { session.cafeSearch = e.target.value; renderKeepFocus('dashCafeSearch'); };

  const dashRetail = document.getElementById('dashRetailSearch');
  if (dashRetail) dashRetail.oninput = (e) => { session.retailSearch = e.target.value; renderKeepFocus('dashRetailSearch'); };

  if (dashRm) dashRm.oninput = (e) => { session.rmSearch = e.target.value; renderKeepFocus('dashRmSearch'); };

  if (purchaseInvoiceNoInput) purchaseInvoiceNoInput.oninput = (e) => { session.purchaseInvoiceNo = e.target.value; };

  document.querySelectorAll('.purchase-item-name').forEach(inp => {
    inp.oninput = (e) => {
      const idx = Number(inp.dataset.idx);
      const val = e.target.value;
      if (session.purchaseItems[idx]) {
        session.purchaseItems[idx].itemName = val;
        const matched = DB.rawMaterials.find(r => r.name.toLowerCase() === val.toLowerCase().trim());
        if (matched) {
          session.purchaseItems[idx].rate = matched.unitPrice || 0;
          const q = Number(session.purchaseItems[idx].receivedQty || 1);
          const r = Number(session.purchaseItems[idx].rate || 0);
          const net = q * r;
          session.purchaseItems[idx].netValue = net;
          session.purchaseItems[idx].gstAmt = net * 0.05;
          renderKeepFocus('purchaseInvoiceNo');
        }
      }
    };
  });

  const addPurchaseLineBtn = document.getElementById('addPurchaseLineBtn');
  if (addPurchaseLineBtn) {
    addPurchaseLineBtn.onclick = () => {
      if (!session.purchaseItems) session.purchaseItems = [];
      session.purchaseItems.push({ itemName: '', code: 'ITEM-004', batch: 'B240820', mfgDate: '2026-08-15', expDate: '2027-02-15', unit: 'Pcs', orderedQty: 1, receivedQty: 1, shortQty: 0, damagedQty: 0, rate: 100, discPct: 0, discAmt: 0, gstGroup: '5%', gstAmt: 5, netValue: 100, lastRate: 95 });
      renderKeepFocus('purchaseInvoiceNo');
    };
  }

  /* SALES WIRING WITH AUTOCOMPLETE DROPDOWN */
  const salesCustomerNameInput = document.getElementById('salesCustomerNameInput');
  if (salesCustomerNameInput) {
    salesCustomerNameInput.onchange = (e) => { 
      session.salesCustomerName = e.target.value; 
      const foundCust = DB.customers.find(c => c.name === e.target.value);
      if (foundCust && foundCust.phone) {
        session.salesCustomerPhone = foundCust.phone;
        renderKeepFocus('globalSalesSearchInput');
      }
    };
  }

  const salesCustomerPhoneInput = document.getElementById('salesCustomerPhoneInput');
  if (salesCustomerPhoneInput) salesCustomerPhoneInput.oninput = (e) => { session.salesCustomerPhone = e.target.value; };

  const globalSalesSearchInput = document.getElementById('globalSalesSearchInput');
  const salesSearchDropdown = document.getElementById('salesSearchDropdown');

  if (globalSalesSearchInput && salesSearchDropdown) {
    globalSalesSearchInput.oninput = (e) => {
      const q = e.target.value.toLowerCase().trim();
      session.salesGlobalSearchQuery = e.target.value;
      if (q.length === 0) {
        salesSearchDropdown.classList.add('hidden');
        salesSearchDropdown.innerHTML = '';
        return;
      }

      const matches = DB.menu.filter(m => m.name.toLowerCase().includes(q));
      if (matches.length > 0) {
        salesSearchDropdown.innerHTML = matches.map(m => `
          <div class="search-suggestion-item p-2.5 hover:bg-brand-50 cursor-pointer border-b border-slate-100 flex justify-between items-center text-xs" data-name="${m.name}" data-price="${m.price}">
            <div>
              <div class="font-bold text-brand-950">${m.name}</div>
              <div class="text-[10px] text-slate-400">${m.category}</div>
            </div>
            <div class="font-mono font-bold text-brand-700">${money(m.price)}</div>
          </div>
        `).join('');
        salesSearchDropdown.classList.remove('hidden');

        document.querySelectorAll('.search-suggestion-item').forEach(el => {
          el.onclick = () => {
            const name = el.dataset.name;
            const price = Number(el.dataset.price);
            session.salesItems.push({ id: uid('s'), barcode: '8906123456782', itemName: name, code: 'CAKE-002', qty: 1, unit: 'Nos', rate: price, discPct: 0, discAmt: 0, gstGroup: '5%', gstAmt: price * 0.05, netValue: price });
            session.salesGlobalSearchQuery = '';
            salesSearchDropdown.classList.add('hidden');
            renderKeepFocus('globalSalesSearchInput');
          };
        });
      } else {
        salesSearchDropdown.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">No matching items found.</div>`;
        salesSearchDropdown.classList.remove('hidden');
      }
    };

    globalSalesSearchInput.onkeydown = (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const matches = DB.menu.filter(m => m.name.toLowerCase().includes(globalSalesSearchInput.value.toLowerCase().trim()));
        if (matches.length > 0) {
          const found = matches[0];
          session.salesItems.push({ id: uid('s'), barcode: '8906123456782', itemName: found.name, code: 'CAKE-002', qty: 1, unit: 'Nos', rate: found.price || 0, discPct: 0, discAmt: 0, gstGroup: '5%', gstAmt: (found.price || 0) * 0.05, netValue: found.price || 0 });
          session.salesGlobalSearchQuery = '';
          salesSearchDropdown.classList.add('hidden');
          renderKeepFocus('globalSalesSearchInput');
        }
      }
    };
  }

  document.querySelectorAll('.sales-qty-inc').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.idx);
      if (session.salesItems[idx]) {
        session.salesItems[idx].qty += 1;
        const q = session.salesItems[idx].qty;
        const r = session.salesItems[idx].rate;
        session.salesItems[idx].netValue = q * r;
        session.salesItems[idx].gstAmt = (q * r) * 0.05;
        renderKeepFocus('globalSalesSearchInput');
      }
    };
  });

  document.querySelectorAll('.sales-qty-dec').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.idx);
      if (session.salesItems[idx] && session.salesItems[idx].qty > 1) {
        session.salesItems[idx].qty -= 1;
        const q = session.salesItems[idx].qty;
        const r = session.salesItems[idx].rate;
        session.salesItems[idx].netValue = q * r;
        session.salesItems[idx].gstAmt = (q * r) * 0.05;
        renderKeepFocus('globalSalesSearchInput');
      }
    };
  });

  document.querySelectorAll('.sales-item-qty').forEach(inp => {
    inp.oninput = (e) => {
      const idx = Number(inp.dataset.idx);
      if (session.salesItems[idx]) {
        session.salesItems[idx].qty = Number(e.target.value) || 0;
        const q = Number(session.salesItems[idx].qty || 0);
        const r = Number(session.salesItems[idx].rate || 0);
        session.salesItems[idx].netValue = q * r;
        session.salesItems[idx].gstAmt = (q * r) * 0.05;
        renderKeepFocus('globalSalesSearchInput');
      }
    };
  });

  document.querySelectorAll('.remove-sales-line').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.idx);
      session.salesItems.splice(idx, 1);
      renderKeepFocus('globalSalesSearchInput');
    };
  });

  const clearSalesCartBtn = document.getElementById('clearSalesCartBtn');
  if (clearSalesCartBtn) {
    clearSalesCartBtn.onclick = () => {
      session.salesItems = [{ barcode: '', itemName: '', qty: 1, unit: 'Nos', rate: 0, discPct: 0, discAmt: 0, gstGroup: '5%', gstAmt: 0, netValue: 0 }];
      renderKeepFocus('globalSalesSearchInput');
    };
  }

  /* QUICK PAYMENT CARDS */
  document.querySelectorAll('.quick-pay-card-btn').forEach(btn => {
    btn.onclick = () => {
      const mode = btn.dataset.mode;
      const grandTotal = (session.salesItems || []).reduce((a, b) => a + Number(b.netValue || 0) + Number(b.gstAmt || 0), 0);
      session.salesPayments = [{ mode, amount: grandTotal }];
      renderKeepFocus('globalSalesSearchInput');
    };
  });

  const toggleSplitPayment = document.getElementById('toggleSplitPayment');
  if (toggleSplitPayment) {
    toggleSplitPayment.onchange = (e) => {
      session.splitPaymentEnabled = e.target.checked;
      renderKeepFocus('globalSalesSearchInput');
    };
  }

  document.querySelectorAll('.payment-mode-select').forEach(sel => {
    sel.onchange = (e) => {
      const idx = Number(sel.dataset.idx);
      if (session.salesPayments[idx]) session.salesPayments[idx].mode = e.target.value;
    };
  });

  document.querySelectorAll('.payment-mode-amount').forEach(inp => {
    inp.oninput = (e) => {
      const idx = Number(inp.dataset.idx);
      if (session.salesPayments[idx]) {
        session.salesPayments[idx].amount = Number(e.target.value) || 0;
        renderKeepFocus('globalSalesSearchInput');
      }
    };
  });

  const addPaymentLineBtn = document.getElementById('addPaymentLineBtn');
  if (addPaymentLineBtn) {
    addPaymentLineBtn.onclick = () => {
      if (!session.salesPayments) session.salesPayments = [];
      const totalVal = (session.salesItems || []).reduce((a, b) => a + Number(b.netValue || 0) + Number(b.gstAmt || 0), 0);
      const currentPaid = session.salesPayments.reduce((a, b) => a + Number(b.amount || 0), 0);
      const remaining = Math.max(0, totalVal - currentPaid);
      session.salesPayments.push({ mode: 'UPI', amount: remaining });
      renderKeepFocus('globalSalesSearchInput');
    };
  }

  document.querySelectorAll('.remove-payment-line').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.idx);
      session.salesPayments.splice(idx, 1);
      renderKeepFocus('globalSalesSearchInput');
    };
  });

  const addSalesLineBtn = document.getElementById('addSalesLineBtn');
  if (addSalesLineBtn) {
    addSalesLineBtn.onclick = () => {
      if (!session.salesItems) session.salesItems = [];
      session.salesItems.push({ barcode: '', itemName: '', qty: 1, unit: 'Nos', rate: 0, discPct: 0, discAmt: 0, gstGroup: '5%', gstAmt: 0, netValue: 0 });
      renderKeepFocus('globalSalesSearchInput');
    };
  }

  const completeSalesBillBtn = document.getElementById('completeSalesBillBtn');
  if (completeSalesBillBtn) {
    completeSalesBillBtn.onclick = async () => {
      const items = session.salesItems || [];
      if (items.length === 0 || !items[0].itemName) {
        toast('Please add at least one valid sales item.', 'alert-triangle');
        return;
      }

      const orderId = Math.floor(1000 + Math.random() * 9000).toString();
      const cartFormatted = items.map(i => ({ id: uid('s'), name: i.itemName, price: i.rate, qty: i.qty, kind: 'cafe' }));
      const primaryPayment = session.salesPayments && session.salesPayments.length > 0 ? session.salesPayments[0].mode : 'Cash';

      const newOrder = {
        id: orderId,
        table: session.salesTableNo || 'Table 12',
        type: session.salesOrderType === 'Takeaway' ? 'retail' : 'cafe',
        customerName: session.salesCustomerName || 'Walk-In Customer',
        customerPhone: session.salesCustomerPhone || '',
        items: cartFormatted,
        paymentMode: primaryPayment,
        payments: session.salesPayments,
        status: 'served',
        ts: Date.now(),
        completedTs: Date.now()
      };

      await db.ref('orders/' + orderId).set(newOrder);
      for (const item of cartFormatted) {
        if (item.id) await processBOMDeduction(item.id, item.qty);
      }

      toast(`Sales Invoice #${orderId} completed & stock updated!`, 'check-circle');
      session.salesItems = [{ barcode: '', itemName: '', qty: 1, unit: 'Nos', rate: 0, discPct: 0, discAmt: 0, gstGroup: '5%', gstAmt: 0, netValue: 0 }];
      session.salesPayments = [{ mode: 'Cash', amount: 0 }];
      session.salesCustomerName = 'Walk-In Customer';
      session.salesCustomerPhone = '9876543210';
      session.showBillingModal = false;
      render();
    };
  }

  /* PHYSICAL STOCK TAKE WIRING */
  document.querySelectorAll('.physical-count-input').forEach(input => {
    input.oninput = (e) => {
      const id = input.dataset.id;
      const unit = input.dataset.unit;
      const physicalVal = Number(e.target.value) || 0;
      const rm = DB.rawMaterials.find(r => r.id === id);
      if (rm) {
        const sysVal = Number(rm.stockGrams || 100000) / ((unit === 'KG' || unit === 'LITRE') ? 1000 : 1);
        const variance = physicalVal - sysVal;
        const varianceCell = document.querySelector(`.variance-cell[data-id="${id}"]`);
        if (varianceCell) {
          varianceCell.textContent = `${variance > 0 ? '+' : ''}${variance.toFixed(2)} ${unit}`;
          varianceCell.className = `p-3 text-right font-mono font-bold ${variance < 0 ? 'text-red-600' : variance > 0 ? 'text-green-600' : 'text-brand-700'} variance-cell`;
        }
      }
    };
  });

  const saveStockTakeBtn = document.getElementById('saveStockTakeBtn');
  if (saveStockTakeBtn) {
    saveStockTakeBtn.onclick = async () => {
      const updates = {};
      document.querySelectorAll('.physical-count-input').forEach(input => {
        const id = input.dataset.id;
        const unit = input.dataset.unit;
        const physicalVal = Number(input.value) || 0;
        const gramsMl = getConvertedGramsMl(physicalVal, unit);
        updates[`rawMaterials/${id}/stockGrams`] = gramsMl;
      });
      await db.ref().update(updates);
      toast('Physical stock take reconciled & system stock updated!', 'check-circle');
      session.showStockTakeModal = false;
      render();
    };
  }

  /* PURCHASE INWARDING WIRING */
  const validatePurchaseBtn = document.getElementById('validatePurchaseBtn');
  if (validatePurchaseBtn) {
    validatePurchaseBtn.onclick = async () => {
      toast('Purchase entry saved successfully!', 'check-circle');
      session.showPurchaseModal = false;
      render();
    };
  }

  /* WASTAGE LOGGING SUBMISSION */
  const submitWastageBtn = document.getElementById('submitWastageBtn');
  if (submitWastageBtn) {
    submitWastageBtn.onclick = async () => {
      const rmName = document.getElementById('wastageRmSelect').value;
      const qty = Number(document.getElementById('wastageQtyInput').value) || 0;
      const unit = document.getElementById('wastageUnitSelect').value;
      const reason = document.getElementById('wastageReasonInput').value.trim() || 'General Spoilage';

      if (!rmName || qty <= 0) {
        toast('Please select a material and enter a valid quantity.', 'alert-triangle');
        return;
      }

      const rm = DB.rawMaterials.find(r => r.name.toLowerCase().trim() === rmName.toLowerCase().trim());
      if (rm) {
        const wasteGrams = getConvertedGramsMl(qty, unit);
        const currentStock = Number(rm.stockGrams ?? 100000);
        const newStock = Math.max(0, currentStock - wasteGrams);
        await db.ref(`rawMaterials/${rm.id}/stockGrams`).set(newStock);
      }

      const logEntry = { id: uid('waste'), item: rmName, qty, unit, reason, staff: session.staff.username, ts: Date.now() };
      DB.wastageLogs.push(logEntry);
      await db.ref('wastageLogs').set(DB.wastageLogs);

      toast('Wastage logged & raw material inventory updated!', 'trash-2');
      session.showWastageModal = false;
      render();
    };
  }

  /* MASTER MAIN RECIPES MODAL HANDLERS */
  const openMainBtn = document.getElementById('openMainRecipesModalBtn');
  if (openMainBtn) openMainBtn.onclick = () => { session.showMainRecipesModal = true; render(); };

  const launchMainBtn = document.getElementById('launchMainMasterBtn');
  if (launchMainBtn) launchMainBtn.onclick = () => { session.showMainRecipesModal = true; render(); };

  const closeMainModalBtn = document.getElementById('closeMainRecipesModalBtn');
  if (closeMainModalBtn) closeMainModalBtn.onclick = () => { session.showMainRecipesModal = false; render(); };

  document.querySelectorAll('.main-recipe-card').forEach(card => {
    card.onclick = () => {
      session.activeRecipeDishId = card.dataset.id;
      render();
    };
  });

  const mainDishSortSelect = document.getElementById('mainDishSortSelect');
  if (mainDishSortSelect) {
    mainDishSortSelect.onchange = (e) => {
      session.recipeSortMode = e.target.value;
      renderKeepFocus('mainDishSortSelect');
    };
  }

  const baseDishSortSelect = document.getElementById('baseDishSortSelect');
  if (baseDishSortSelect) {
    baseDishSortSelect.onchange = (e) => {
      session.baseRecipeSortMode = e.target.value;
      renderKeepFocus('baseDishSortSelect');
    };
  }

  const masterDishNameInput = document.getElementById('masterDishNameInput');
  if (masterDishNameInput) {
    masterDishNameInput.oninput = async (e) => {
      const dishId = masterDishNameInput.dataset.id;
      const newName = e.target.value.trim();
      if (!dishId || !newName) return;
      await db.ref(`menu/${dishId}/name`).set(newName);
      const menuDish = DB.menu.find(m => m.id === dishId);
      if (menuDish) menuDish.name = newName;
    };
  }

  const liveLetterInput = document.getElementById('liveLetterSearchInput');
  if (liveLetterInput) {
    liveLetterInput.oninput = (e) => {
      session.recipeFilterQuery = e.target.value;
      renderKeepFocus('liveLetterSearchInput');
    };
  }

  const liveIngInput = document.getElementById('liveIngredientSearchInput');
  if (liveIngInput) {
    liveIngInput.oninput = (e) => {
      session.ingredientUsageQuery = e.target.value;
      renderKeepFocus('liveIngredientSearchInput');
    };
  }

  const manageIngBtn = document.getElementById('manageIngredientsBtn');
  if (manageIngBtn) manageIngBtn.onclick = () => { session.showRawMaterialsModal = true; render(); };

  const closeRmBtn = document.getElementById('closeRawMaterialsBtn');
  if (closeRmBtn) closeRmBtn.onclick = () => { session.showRawMaterialsModal = false; render(); };

  const addRmBtn = document.getElementById('addRmBtn');
  if (addRmBtn) {
    addRmBtn.onclick = async () => {
      const name = document.getElementById('newRmName').value.trim();
      const vendor = document.getElementById('newRmVendor').value.trim() || 'FACTORY';
      const unit = document.getElementById('newRmUnit').value;
      const unitPrice = Number(document.getElementById('newRmPrice').value) || 0;

      if (!name) { toast('Enter raw material name.', 'alert-triangle'); return; }

      const newItem = { id: uid('rm'), name, vendor, unit, unitPrice };
      await db.ref('rawMaterials/' + newItem.id).set(newItem);
      toast('Raw material saved!', 'check-circle');
    };
  }

  document.querySelectorAll('.delete-rm-btn').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id;
      await db.ref('rawMaterials/' + id).remove();
      toast('Raw material removed.');
    };
  });

  const manageBaseBtn = document.getElementById('manageBaseRecipesBtn');
  if (manageBaseBtn) {
    manageBaseBtn.onclick = () => {
      session.showBaseRecipesModal = true;
      if (!session.editingBaseRecipeId && DB.baseRecipes.length > 0) {
        session.editingBaseRecipeId = DB.baseRecipes[0].id;
      }
      render();
    };
  }

  const closeBaseBtn = document.getElementById('closeBaseRecipesBtn');
  if (closeBaseBtn) closeBaseBtn.onclick = () => { session.showBaseRecipesModal = false; render(); };

  const createNewBaseBtn = document.getElementById('createNewBaseRecipeBtn');
  if (createNewBaseBtn) {
    createNewBaseBtn.onclick = async () => {
      const newBase = { id: uid('br'), name: 'New Base Prep', batchYield: 1, unit: 'GRM', ingredients: [] };
      await db.ref('baseRecipes/' + newBase.id).set(newBase);
      session.editingBaseRecipeId = newBase.id;
      render();
    };
  }

  document.querySelectorAll('.base-recipe-card').forEach(card => {
    card.onclick = () => {
      session.editingBaseRecipeId = card.dataset.id;
      render();
    };
  });

  const saveBaseRecipeBtn = document.getElementById('saveBaseRecipeBtn');
  if (saveBaseRecipeBtn && session.editingBaseRecipeId) {
    saveBaseRecipeBtn.onclick = async () => {
      const activeBase = DB.baseRecipes.find(b => b.id === session.editingBaseRecipeId);
      if (activeBase) {
        activeBase.name = document.getElementById('baseName').value.trim();
        activeBase.batchYield = Number(document.getElementById('baseYield').value) || 1;
        activeBase.unit = document.getElementById('baseUnit').value;
        await db.ref('baseRecipes/' + activeBase.id).set(activeBase);
        toast('Base recipe saved!', 'check-circle');
      }
    };
  }

  const deleteBaseRecipeBtn = document.getElementById('deleteBaseRecipeBtn');
  if (deleteBaseRecipeBtn && session.editingBaseRecipeId) {
    deleteBaseRecipeBtn.onclick = async () => {
      if (confirm('Delete this base prep?')) {
        await db.ref('baseRecipes/' + session.editingBaseRecipeId).remove();
        session.editingBaseRecipeId = null;
        render();
      }
    };
  }
}

async function executePurchaseSaveWithDetails(rm, invoiceNo, vendor, vendorPhone, vendorGst, rmName, qty, unit, totalAmount, newRate) {
  if (rm) {
    const addedGrams = getConvertedGramsMl(qty, unit);
    const currentStock = Number(rm.stockGrams ?? 100000);
    const newStock = currentStock + addedGrams;

    await db.ref(`rawMaterials/${rm.id}/stockGrams`).set(newStock);
    await db.ref(`rawMaterials/${rm.id}/unitPrice`).set(newRate);
  }

  const purchaseLog = {
    id: uid('p'),
    invoiceNo,
    vendor,
    vendorPhone,
    vendorGst,
    itemName: rmName,
    qty,
    unit,
    totalAmount,
    rate: newRate,
    staff: session.staff.username,
    ts: Date.now()
  };

  DB.purchases.push(purchaseLog);
  await db.ref('purchases').set(DB.purchases);
}

function renderKeepFocus(inputId) {
  const activeEl = document.getElementById(inputId);
  const start = activeEl ? activeEl.selectionStart : null;
  const end = activeEl ? activeEl.selectionEnd : null;

  render();

  const el = document.getElementById(inputId);
  if (el) {
    el.focus();
    if (start !== null && end !== null) el.setSelectionRange(start, end);
  }
}

db.ref('menu').on('value', snap => {
  const data = snap.val();
  DB.menu = data ? Object.values(data) : [];
  if (session.editingDish === null) render();
});

db.ref('retail').on('value', snap => {
  const data = snap.val();
  DB.retail = data ? Object.values(data) : [];
  if (session.editingRetail === null) render();
});

db.ref('orders').on('value', snap => {
  const data = snap.val();
  DB.orders = data ? Object.values(data) : [];
  render();
});

db.ref('rawMaterials').on('value', snap => {
  const data = snap.val();
  DB.rawMaterials = data ? Object.values(data) : [];
  render();
});

db.ref('baseRecipes').on('value', snap => {
  const data = snap.val();
  DB.baseRecipes = data ? Object.values(data) : [];
  render();
});

db.ref('recipes').on('value', snap => {
  const data = snap.val();
  DB.recipes = data || {};
  render();
});

db.ref('wastageLogs').on('value', snap => {
  const data = snap.val();
  DB.wastageLogs = data || [];
  render();
});

db.ref('purchases').on('value', snap => {
  const data = snap.val();
  DB.purchases = data || [];
  render();
});

db.ref('paymentModes').on('value', snap => {
  const data = snap.val();
  if (data) DB.paymentModes = data;
  render();
});

db.ref('settings').on('value', snap => {
  const data = snap.val();
  if (data) { DB.settings = data; render(); }
});

(function boot() {
  document.addEventListener('touchstart', unlockAudio, { once: true });
  document.addEventListener('click', unlockAudio, { once: true });

  // Foolproof global click delegation
  document.addEventListener('click', (e) => {
    const kTabBtn = e.target.closest('[data-ktab]');
    if (kTabBtn) {
      session.kitchenTab = kTabBtn.dataset.ktab;
      render();
      return;
    }
    if (e.target.closest('#openBillingModalBtn')) {
      session.showBillingModal = true;
      const totalVal = (session.salesItems || []).reduce((a, b) => a + Number(b.netValue || 0) + Number(b.gstAmt || 0), 0);
      session.salesPayments = [{ mode: 'Cash', amount: totalVal }];
      render();
      return;
    }
    if (e.target.closest('#openPurchaseModalBtn')) {
      session.showPurchaseModal = true;
      render();
      return;
    }
    if (e.target.closest('#openStockTakeModalBtn')) {
      session.showStockTakeModal = true;
      render();
      return;
    }
    if (e.target.closest('#openWastageModalBtn')) {
      session.showWastageModal = true;
      render();
      return;
    }
    if (e.target.closest('#closeBillingModalBtn')) {
      session.showBillingModal = false;
      render();
      return;
    }
    if (e.target.closest('#closePurchaseModalBtn')) {
      session.showPurchaseModal = false;
      render();
      return;
    }
    if (e.target.closest('#closeStockTakeModalBtn')) {
      session.showStockTakeModal = false;
      render();
      return;
    }
    if (e.target.closest('#closeWastageModalBtn')) {
      session.showWastageModal = false;
      render();
      return;
    }
  });

  render();
})();
</script>
