function compressAndGetBase64(file, maxWidth = 600, maxHeight = 600, quality = 0.7) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve('');
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > height) {
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
        } else {
          if (height > maxHeight) {
            width = Math.round((width * maxHeight) / height);
            height = maxHeight;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = (err) => reject(err);
    };
    reader.onerror = (err) => reject(err);
  });
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return s + 's ago';
  const m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60); return h + 'h ago';
}

function formatDuration(ms) {
  if (!ms || ms < 0) return '—';
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}m ${s}s`;
}

function formatTime(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function calculateOrderTotal(order) {
  const items = order.items || [];
  const sub = items.reduce((a, b) => a + (b.price * b.qty), 0);
  return sub + (sub * 0.05);
}

function getRawMaterialDetails(name) {
  if (!name) return { unitPrice: 0, vendor: 'FACTORY', unit: 'GRM' };
  const cleanName = name.toLowerCase().trim();
  const found = DB.rawMaterials.find(r => (r.name || '').toLowerCase().trim() === cleanName);
  return found || { unitPrice: 0, vendor: 'FACTORY', unit: 'GRM' };
}

function calculateIngCost(ing) {
  const qty = Number(ing.qty || 0);
  const unit = (ing.unit || 'GRM').toUpperCase();

  if (ing.type === 'base' || ing.isBase) {
    const baseObj = DB.baseRecipes.find(b => (b.name || '').toLowerCase().trim() === (ing.name || '').toLowerCase().trim());
    if (baseObj) {
      const unitRate = calculateBaseRecipeCostPerUnit(baseObj);
      const gramsMl = Number(ing.gramsMl || getConvertedGramsMl(qty, unit));
      return (gramsMl / 1000) * unitRate;
    }
  }

  let rate = Number(ing.unitPrice || 0);
  if (!rate && ing.name) {
    rate = getRawMaterialDetails(ing.name).unitPrice;
  }

  let gramsMl = Number(ing.gramsMl || 0);

  if (!gramsMl) {
    switch(unit) {
      case 'KG':
      case 'LITRE': gramsMl = qty * 1000; break;
      case 'TSP': gramsMl = qty * 5; break;
      case 'TBSP': gramsMl = qty * 15; break;
      case 'GRM':
      case 'ML':
      case 'G':
      case 'PCS':
      default: gramsMl = qty; break;
    }
  }

  return (gramsMl / 1000) * rate;
}

function getConvertedGramsMl(qty, unit) {
  const q = Number(qty || 0);
  const u = (unit || 'GRM').toUpperCase();
  switch(u) {
    case 'KG':
    case 'LITRE': return q * 1000;
    case 'TSP': return q * 5;
    case 'TBSP': return q * 15;
    case 'GRM':
    case 'ML':
    case 'PCS':
    default: return q;
  }
}

function calculateBaseRecipeCostPerUnit(base) {
  if (!base || !base.ingredients) return 0;
  const totalBatchCost = base.ingredients.reduce((sum, ing) => sum + calculateIngCost(ing), 0);
  const yieldQty = Number(base.batchYield || 1);
  return yieldQty > 0 ? (totalBatchCost / yieldQty) : 0;
}

function getDishFoodCostPercent(dish) {
  const recipe = DB.recipes[dish.id];
  if (!recipe || !recipe.ingredients) return 0;
  const rawTotal = (recipe.ingredients || []).reduce((sum, ing) => sum + calculateIngCost(ing), 0);
  const wastage = rawTotal * ((recipe.wastagePercent || 10) / 100);
  const totalCost = rawTotal + wastage;
  const portionCost = recipe.portions ? (totalCost / recipe.portions) : 0;
  const price = Number(dish.price || 0);
  return price > 0 ? (portionCost / price) * 100 : 0;
}

async function processBOMDeduction(dishId, orderedPortions = 1) {
  const recipe = DB.recipes[dishId];
  if (!recipe || !recipe.ingredients) return;

  const updates = {};

  function cascadeIngredient(ing, multiplier) {
    if (ing.type === 'base' || ing.isBase) {
      const baseObj = DB.baseRecipes.find(b => (b.name || '').toLowerCase().trim() === (ing.name || '').toLowerCase().trim());
      if (baseObj && baseObj.ingredients) {
        const baseUsageGrams = Number(ing.gramsMl || getConvertedGramsMl(ing.qty, ing.unit)) * multiplier;
        const baseYieldGrams = Number(baseObj.batchYield || 1);
        const batchFraction = baseYieldGrams > 0 ? (baseUsageGrams / baseYieldGrams) : 0;

        baseObj.ingredients.forEach(subIng => {
          cascadeIngredient(subIng, batchFraction);
        });
      }
    } else {
      const rm = DB.rawMaterials.find(r => (r.name || '').toLowerCase().trim() === (ing.name || '').toLowerCase().trim());
      if (rm) {
        const requiredGrams = Number(ing.gramsMl || getConvertedGramsMl(ing.qty, ing.unit)) * multiplier;
        const currentStock = Number(rm.stockGrams ?? 100000);
        const newStock = Math.max(0, currentStock - requiredGrams);
        updates[`rawMaterials/${rm.id}/stockGrams`] = newStock;
      }
    }
  }

  recipe.ingredients.forEach(ing => cascadeIngredient(ing, orderedPortions));

  if (Object.keys(updates).length > 0) {
    await db.ref().update(updates);
  }
}

function exportBillWiseReportToExcel() {
  const completedOrders = [...DB.orders].filter(o => o.status === 'served');
  const data = completedOrders.map(o => ({
    "Order ID": o.id,
    "Date": new Date(o.ts).toLocaleDateString(),
    "Time": new Date(o.ts).toLocaleTimeString(),
    "Table No": o.table,
    "Billing Type": (o.type === 'qr' ? 'QR Table Billing' : 'Manual Counter Billing'),
    "Customer Name": o.customerName || 'Guest',
    "Phone": o.customerPhone || 'N/A',
    "Payment Mode": o.paymentMode || 'UPI',
    "Subtotal (₹)": (o.items || []).reduce((acc, i) => acc + (i.price * i.qty), 0).toFixed(2),
    "Tax / Charges (5%)": ((o.items || []).reduce((acc, i) => acc + (i.price * i.qty), 0) * 0.05).toFixed(2),
    "Total Billed (₹)": calculateOrderTotal(o).toFixed(2)
  }));

  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Bill-Wise Sales Report");
  XLSX.writeFile(wb, "BillWise_Sales_Report.xlsx");
  toast("Bill-Wise Report downloaded successfully!", "file-spreadsheet");
}

function exportItemWiseReportToExcel() {
  const itemSales = {};
  DB.orders.filter(o => o.status === 'served').forEach(o => {
    (o.items || []).forEach(i => {
      if (!itemSales[i.name]) itemSales[i.name] = { category: i.kind || 'cafe', qty: 0, revenue: 0 };
      itemSales[i.name].qty += Number(i.qty || 1);
      itemSales[i.name].revenue += Number(i.price || 0) * Number(i.qty || 1);
    });
  });

  const data = Object.entries(itemSales).map(([name, info]) => ({
    "Item Name": name,
    "Category": info.category.toUpperCase(),
    "Total Units Sold": info.qty,
    "Total Revenue (₹)": info.revenue.toFixed(2)
  }));

  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Item-Wise Sales Report");
  XLSX.writeFile(wb, "ItemWise_Sales_Report.xlsx");
  toast("Item-Wise Report downloaded successfully!", "file-spreadsheet");
}

function exportMonthlyStockReconciliationToExcel() {
  const data = DB.rawMaterials.map(rm => {
    const openingQty = Number(rm.openingQty || 10);
    const openingVal = Number(rm.openingValue || 2000);
    const purchaseQty = DB.purchases.filter(p => p.itemName === rm.name).reduce((sum, p) => sum + Number(p.qty), 0);
    const purchaseVal = DB.purchases.filter(p => p.itemName === rm.name).reduce((sum, p) => sum + Number(p.totalAmount), 0);
    const soldQty = 5;
    const soldVal = soldQty * Number(rm.unitPrice || 100);
    const wasteQty = DB.wastageLogs.filter(w => w.item === rm.name).reduce((sum, w) => sum + Number(w.qty), 0);
    const wasteVal = wasteQty * Number(rm.unitPrice || 100);
    const closingQty = Math.max(0, openingQty + purchaseQty - soldQty - wasteQty);
    const closingVal = closingQty * Number(rm.unitPrice || 100);

    return {
      "Item Name": rm.name,
      "Opening Qty": openingQty,
      "Opening Value (₹)": openingVal,
      "Purchase Qty": purchaseQty,
      "Purchase Value (₹)": purchaseVal,
      "Sold / Consumed Qty": soldQty,
      "Sold / Consumed Value (₹)": soldVal,
      "Waste Qty": wasteQty,
      "Waste Value (₹)": wasteVal,
      "Closing Qty": closingQty,
      "Closing Value (₹)": closingVal
    };
  });

  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Monthly Stock Reconciliation");
  XLSX.writeFile(wb, "Monthly_Stock_Reconciliation.xlsx");
  toast("Monthly Stock Reconciliation downloaded!", "file-spreadsheet");
}

function wireLogin() {
  const submitBtn = document.getElementById('loginSubmit');
  if (submitBtn) {
    submitBtn.onclick = () => {
      unlockAudio();
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value;
      const found = DB.staff.find(s => s.username === u && s.password === p);
      const err = document.getElementById('loginError');
      if (found) {
        session.staff = found;
        localStorage.setItem('ps_staff', JSON.stringify(found));
        session.kitchenTab = 'orders'; 
        render(); 
        toast('Welcome back, ' + found.username, 'log-in');
      } else {
        if (err) {
          err.textContent = 'Incorrect username or password.'; 
          err.classList.remove('hidden');
        }
      }
    };
  }
}

              const purchaseVal = DB.purchases.filter(p => p.itemName === rm.name).reduce((sum, p) => sum + Number(p.totalAmount), 0);
              const soldQty = 5;
              const soldVal = soldQty * Number(rm.unitPrice || 100);
              const wasteQty = DB.wastageLogs.filter(w => w.item === rm.name).reduce((sum, w) => sum + Number(w.qty), 0);

              return `

        </table>

  </div>`;
}

function menuEngineeringPanel() {
  const menuItems = DB.menu;
  let totalSoldUnits = 0;
  const itemCounts = {};
  DB.orders.filter(o => o.status === 'served').forEach(o => {
    (o.items || []).forEach(i => {
      itemCounts[i.name] = (itemCounts[i.name] || 0) + Number(i.qty || 1);
      totalSoldUnits += Number(i.qty || 1);
    });
  });

  const avgPopularity = menuItems.length > 0 ? totalSoldUnits / menuItems.length : 0;

  const categorized = menuItems.map(m => {
    const sold = itemCounts[m.name] || 0;
    const foodCostPct = getDishFoodCostPercent(m);
    const grossMargin = 100 - foodCostPct;
    
    let classification = 'Dog 🐶';
    let color = 'bg-red-50 text-red-800 border-red-200';

    const isPopular = sold >= avgPopularity;
    const isProfitable = grossMargin >= 65;

    if (isPopular && isProfitable) {
      classification = 'Star ⭐';
      color = 'bg-green-50 text-green-800 border-green-200';
    } else if (isPopular && !isProfitable) {
      classification = 'Plowhorse 🐴';
      color = 'bg-amber-50 text-amber-800 border-amber-200';
    } else if (!isPopular && isProfitable) {
      classification = 'Puzzle 🧩';
      color = 'bg-blue-50 text-blue-800 border-blue-200';
    }

    return { name: m.name, category: m.category, price: m.price, sold, grossMargin: grossMargin.toFixed(1), classification, color };
  });

  return `
  <div class="space-y-5">
    <div class="bg-white rounded-2xl card-shadow p-5">
      <h3 class="font-display text-lg font-bold text-brand-950 mb-1">Menu Engineering Matrix</h3>
      <p class="text-xs text-brand-400 mb-4">Automatically categorizes your menu items into Stars, Plowhorses, Puzzles, and Dogs.</p>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
        <div class="bg-green-50/60 p-4 rounded-xl border border-green-200">
          <div class="text-xs font-bold text-green-800">Stars ⭐</div>
          <div class="text-[11px] text-green-600 mt-0.5">High Profit &amp; High Popularity.</div>
        </div>
        <div class="bg-amber-50/60 p-4 rounded-xl border border-amber-200">
          <div class="text-xs font-bold text-amber-800">Plowhorses 🐴</div>
          <div class="text-[11px] text-amber-600 mt-0.5">Low Profit &amp; High Popularity.</div>
        </div>
        <div class="bg-blue-50/60 p-4 rounded-xl border border-blue-200">
          <div class="text-xs font-bold text-blue-800">Puzzle 🧩</div>
          <div class="text-[11px] text-blue-600 mt-0.5">High Profit &amp; Low Popularity.</div>
        </div>
        <div class="bg-red-50/60 p-4 rounded-xl border border-red-200">
          <div class="text-xs font-bold text-red-800">Dogs 🐶</div>
          <div class="text-[11px] text-red-600 mt-0.5">Low Profit &amp; Low Popularity.</div>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs min-w-[650px]">
          <thead class="bg-brand-50 text-brand-800 uppercase font-bold text-[10px]">
            <tr>
              <th class="p-3">Dish Name</th>
              <th class="p-3">Category</th>
              <th class="p-3 text-center">Units Sold</th>
              <th class="p-3 text-right">Gross Margin %</th>
              <th class="p-3 text-center">Classification</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-brand-50 font-medium">
            ${categorized.map(item => `
              <tr class="hover:bg-brand-50/40">
                <td class="p-3 font-bold text-brand-950">${item.name}</td>
                <td class="p-3 text-brand-500">${item.category}</td>
                <td class="p-3 text-center font-bold">${item.sold}</td>
                <td class="p-3 text-right font-bold text-brand-900">${item.grossMargin}%</td>
                <td class="p-3 text-center"><span class="px-3 py-1 rounded-full text-xs font-bold border ${item.color}">${item.classification}</span></td>
              </tr>
            `).join('') || `<tr><td colspan="5" class="text-center py-8 text-brand-400">No menu items available.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  </div>`;
}

function mainRecipesModal() {
  if (!session.activeRecipeDishId && DB.menu.length > 0) {
    session.activeRecipeDishId = DB.menu[0].id;
  }
  const selectedDish = DB.menu.find(m => m.id === session.activeRecipeDishId);
  const activeRecipe = session.activeRecipeDishId ? (DB.recipes[session.activeRecipeDishId] || { portions: 1, wastagePercent: 10, ingredients: [] }) : null;

  let rawTotalCost = 0;
  if (activeRecipe) {
    rawTotalCost = (activeRecipe.ingredients || []).reduce((sum, ing) => sum + calculateIngCost(ing), 0);
  }
  
  const wastageCost = rawTotalCost * ((activeRecipe?.wastagePercent || 10) / 100);
  const totalProductionCost = rawTotalCost + wastageCost;
  const costPerPortion = activeRecipe?.portions ? (totalProductionCost / activeRecipe.portions) : 0;

  const sellingPrice = selectedDish ? Number(selectedDish.price || 0) : 0;
  const profitMargin = sellingPrice - costPerPortion;
  const foodCostPercent = sellingPrice > 0 ? ((costPerPortion / sellingPrice) * 100) : 0;
  const grossMarginPercent = sellingPrice > 0 ? ((profitMargin / sellingPrice) * 100) : 0;

  const sortedRawMaterials = [...DB.rawMaterials].sort((a,b) => (a.name || '').localeCompare(b.name || ''));
  const sortedBaseRecipes = [...DB.baseRecipes].sort((a,b) => (a.name || '').localeCompare(b.name || ''));

  const recipeFilterQuery = (session.recipeFilterQuery || '').toLowerCase().trim();
  let filteredMenu = DB.menu.filter(m => {
    if (!recipeFilterQuery) return true;
    return (m.name || '').toLowerCase().includes(recipeFilterQuery);
  });

  if (session.recipeSortMode === 'cost') {
    filteredMenu.sort((a, b) => getDishFoodCostPercent(b) - getDishFoodCostPercent(a));
  } else {
    filteredMenu.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  }

  let matchingUsage = [];
  const ingQuery = (session.ingredientUsageQuery || '').toLowerCase().trim();
  if (ingQuery.length >= 2) {
    for (const dishId in DB.recipes) {
      const rec = DB.recipes[dishId];
      const dishObj = DB.menu.find(m => m.id === dishId);
      const dishName = dishObj ? dishObj.name : `Dish (${dishId})`;
      const usesItem = (rec.ingredients || []).some(i => (i.name || '').toLowerCase().includes(ingQuery));
      if (usesItem) matchingUsage.push(`[MAIN DISH] ${dishName}`);
    }
    DB.baseRecipes.forEach(br => {
      const usesItem = (br.ingredients || []).some(i => (i.name || '').toLowerCase().includes(ingQuery));
      if (usesItem) matchingUsage.push(`[BASE PREP] ${br.name}`);
    });
  }

  return `

                      unitPrice = Number(ing.unitPrice) || masterDetails.unitPrice || 0;
                    }

                    const computedGrams = getConvertedGramsMl(ing.qty, ing.unit);

                    return `

                      <td class="p-2 text-center font-bold text-brand-700 border-r border-amber-200">${idx+1}</td>

                          <option value="">-- Choose Item --</option>
                          ${isBase ?
                            sortedBaseRecipes.filter(b => b.id !== activeBase.id).map(br => `<option value="br_${br.name}" ${(ing.name || '').toLowerCase().trim() === (br.name || '').toLowerCase().trim() ? 'selected' : ''}>⭐ ${br.name}</option>`).join('') :
                            sortedRawMaterials.map(rm => `<option value="rm_${rm.name}" ${(ing.name || '').toLowerCase().trim() === (rm.name || '').toLowerCase().trim() ? 'selected' : ''}>${rm.name}</option>`).join('')
                          }

                      </td>
                      <td class="p-2 border-r border-amber-200">
                        <input type="number" step="0.01" class="base-ing-qty w-full border border-amber-200 bg-white rounded p-1 text-xs text-center font-bold" data-idx="${idx}" value="${ing.qty || 1}">

                      <td class="p-2 border-r border-amber-200">
                        <select class="base-ing-unit w-full border border-amber-200 bg-white rounded p-1 text-xs font-semibold" data-idx="${idx}">
                          <option ${ing.unit === 'GRM' ? 'selected' : ''}>GRM</option>
                          <option ${ing.unit === 'ML' ? 'selected' : ''}>ML</option>
                          <option ${ing.unit === 'KG' ? 'selected' : ''}>KG</option>
                          <option ${ing.unit === 'LITRE' ? 'selected' : ''}>LITRE</option>
                          <option ${ing.unit === 'TSP' ? 'selected' : ''}>TSP</option>
                          <option ${ing.unit === 'TBSP' ? 'selected' : ''}>TBSP</option>
                          <option ${ing.unit === 'PCS' ? 'selected' : ''}>PCS</option>
                        </select>
                      </td>
                      <td class="p-2 border-r border-amber-200">
                        <input type="number" step="0.01" class="base-ing-grams w-full border border-amber-200 bg-white rounded p-1 text-xs text-center font-bold" data-idx="${idx}" value="${ing.gramsMl || computedGrams}">
                      </td>
                      <td class="p-2 border-r border-amber-200 font-semibold text-brand-700 truncate text-[11px]">
                        ${vendor}
                      </td>
                      <td class="p-2 border-r border-amber-200 text-right font-bold">
                        ${money(unitPrice)}
                      </td>
                      <td class="p-2 text-right font-bold text-brand-950 base-ing-cost-cell">
                        ${money(calculateIngCost({ ...ing, gramsMl: ing.gramsMl || computedGrams, unitPrice }))}
                      </td>
                      <td class="p-2 text-center">
                        <button class="remove-base-ing text-red-500 hover:text-red-700 p-1" data-idx="${idx}"><i data-lucide="trash-2" class="w-3.5 h-3.5 mx-auto"></i></button>
                      </td>
                    </tr>
                  `;}).join('') || `<tr><td colspan="9" class="text-center py-4 text-brand-400">No ingredients in this batch yet.</td></tr>`}
                </tbody>
              </table>
            </div>

            <div class="flex items-center justify-between bg-gold-50/90 p-3 rounded-xl border border-gold-200 text-xs font-bold text-brand-950">
              <span>Total Batch: <span id="baseSummaryTotalCost">${money(totalCost)}</span></span>

        </div>
      </div>
    </div>
  </div>`;

function recalculateMainRecipeTotals() {
  if (!session.activeRecipeDishId || !DB.recipes[session.activeRecipeDishId]) return;
  const recipe = DB.recipes[session.activeRecipeDishId];
  const selectedDish = DB.menu.find(m => m.id === session.activeRecipeDishId);

  const rawTotalCost = (recipe.ingredients || []).reduce((sum, ing) => sum + calculateIngCost(ing), 0);
  const wastageCost = rawTotalCost * ((recipe.wastagePercent || 10) / 100);
  const totalProductionCost = rawTotalCost + wastageCost;
  const costPerPortion = recipe.portions ? (totalProductionCost / recipe.portions) : 0;
  const sellingPrice = selectedDish ? Number(selectedDish.price || 0) : 0;
  const profitMargin = sellingPrice - costPerPortion;
  const foodCostPercent = sellingPrice > 0 ? ((costPerPortion / sellingPrice) * 100) : 0;
  const grossMarginPercent = sellingPrice > 0 ? ((profitMargin / sellingPrice) * 100) : 0;

  const summaryRaw = document.getElementById('summaryRawCost');
  if (summaryRaw) summaryRaw.textContent = money(rawTotalCost);

  const summaryWastage = document.getElementById('summaryWastageCost');
  if (summaryWastage) summaryWastage.textContent = money(wastageCost);

  const summaryTotal = document.getElementById('summaryTotalCost');
  if (summaryTotal) summaryTotal.textContent = money(totalProductionCost);

  const summaryPortion = document.getElementById('summaryCostPerPortion');
  if (summaryPortion) summaryPortion.textContent = money(costPerPortion);

  const summaryMargin = document.getElementById('summaryProfitMargin');
  if (summaryMargin) {
    summaryMargin.textContent = money(profitMargin);
    summaryMargin.className = profitMargin >= 0 ? 'text-green-700 font-bold' : 'text-red-600 font-bold';
  }

  const summaryFoodCost = document.getElementById('summaryFoodCostPct');
  if (summaryFoodCost) {
    summaryFoodCost.textContent = foodCostPercent.toFixed(1) + '%';
    summaryFoodCost.className = `text-xs font-bold ${foodCostPercent <= 35 ? 'text-green-700' : 'text-red-600'}`;
  }

  const summaryGrossMargin = document.getElementById('summaryGrossMarginPct');
  if (summaryGrossMargin) summaryGrossMargin.textContent = grossMarginPercent.toFixed(1) + '%';
}

function recalculateBaseRecipeTotals() {
  if (!session.editingBaseRecipeId) return;
  const activeBase = DB.baseRecipes.find(b => b.id === session.editingBaseRecipeId);
  if (!activeBase) return;

  const totalCost = (activeBase.ingredients || []).reduce((sum, i) => sum + calculateIngCost(i), 0);
  const costPerUnit = activeBase.batchYield ? (totalCost / activeBase.batchYield) : 0;

  const baseTotalEl = document.getElementById('baseSummaryTotalCost');
  if (baseTotalEl) baseTotalEl.textContent = money(totalCost);

  const baseRateEl = document.getElementById('baseSummaryUnitRate');
  if (baseRateEl) baseRateEl.textContent = money(costPerUnit);
}

function wireKitchen() {
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) {
    logoutBtn.onclick = () => { 
      localStorage.removeItem('ps_staff');
      session.staff = null; 
      render(); 
    };
  }

  const soundToggle = document.getElementById('soundToggle');
  if (soundToggle) {
    soundToggle.onclick = () => { unlockAudio(); session.soundOn = !session.soundOn; render(); };
  }

  document.querySelectorAll('.k-tab').forEach(b => {
    b.onclick = () => { 
      session.kitchenTab = b.dataset.ktab; 
      render(); 
    };
  });

  const dashCafe = document.getElementById('dashCafeSearch');
  if (dashCafe) dashCafe.oninput = (e) => { session.cafeSearch = e.target.value; renderKeepFocus('dashCafeSearch'); };

  const dashRetail = document.getElementById('dashRetailSearch');
  if (dashRetail) dashRetail.oninput = (e) => { session.retailSearch = e.target.value; renderKeepFocus('dashRetailSearch'); };

  const dashRm = document.getElementById('dashRmSearch');
  if (dashRm) dashRm.oninput = (e) => { session.rmSearch = e.target.value; renderKeepFocus('dashRmSearch'); };

  const stockTakeSearchInput = document.getElementById('stockTakeSearchInput');
  if (stockTakeSearchInput) stockTakeSearchInput.oninput = (e) => { session.stockTakeSearch = e.target.value; renderKeepFocus('stockTakeSearchInput'); };

  const purchaseSearchInput = document.getElementById('purchaseSearchInput');
  if (purchaseSearchInput) {
    purchaseSearchInput.oninput = (e) => { 
      session.purchaseSearch = e.target.value; 
      renderKeepFocus('purchaseSearchInput'); 
    };
  }

  const purchaseRmSelect = document.getElementById('purchaseRmSelect');
  if (purchaseRmSelect) {
    purchaseRmSelect.onchange = (e) => {
      session.selectedPurchaseItem = e.target.value;
    };
  }

  /* MODAL TRIGGERS */
  const openBillBtn = document.getElementById('openBillingModalBtn');
  if (openBillBtn) openBillBtn.onclick = () => { session.showBillingModal = true; render(); };

  const closeBillBtn = document.getElementById('closeBillingModalBtn');
  if (closeBillBtn) closeBillBtn.onclick = () => { session.showBillingModal = false; render(); };

  const openPurchaseBtn = document.getElementById('openPurchaseModalBtn');
  if (openPurchaseBtn) openPurchaseBtn.onclick = () => { session.showPurchaseModal = true; render(); };

  const closePurchaseBtn = document.getElementById('closePurchaseModalBtn');
  if (closePurchaseBtn) closePurchaseBtn.onclick = () => { session.showPurchaseModal = false; render(); };

  const openStockTakeBtn = document.getElementById('openStockTakeModalBtn');
  if (openStockTakeBtn) openStockTakeBtn.onclick = () => { session.showStockTakeModal = true; render(); };

  const closeStockTakeBtn = document.getElementById('closeStockTakeModalBtn');
  if (closeStockTakeBtn) closeStockTakeBtn.onclick = () => { session.showStockTakeModal = false; render(); };

  const openWastageBtn = document.getElementById('openWastageModalBtn');
  if (openWastageBtn) openWastageBtn.onclick = () => { session.showWastageModal = true; render(); };

  const closeWastageBtn = document.getElementById('closeWastageModalBtn');
  if (closeWastageBtn) closeWastageBtn.onclick = () => { session.showWastageModal = false; render(); };

  /* LIVE PHYSICAL STOCK TAKE VARIANCE CALCULATION */
  document.querySelectorAll('.physical-count-input').forEach(input => {
    input.oninput = (e) => {
      const id = input.dataset.id;
      const unit = input.dataset.unit;
      const physicalVal = Number(e.target.value) || 0;
      const rm = DB.rawMaterials.find(r => r.id === id);
      if (rm) {
        const sysVal = Number(rm.stockGrams || 100000) / ((unit === 'KG' || unit === 'LITRE') ? 1000 : 1);
        const variance = physicalVal - sysVal;
        const varianceCell = document.querySelector(`.variance-cell[data-id="${id}"]`);
        if (varianceCell) {
          varianceCell.textContent = `${variance > 0 ? '+' : ''}${variance.toFixed(2)} ${unit}`;
          varianceCell.className = `p-3 text-right font-mono font-bold ${variance < 0 ? 'text-red-600' : variance > 0 ? 'text-green-600' : 'text-brand-700'} variance-cell`;
        }
      }
    };
  });

  const saveStockTakeBtn = document.getElementById('saveStockTakeBtn');
  if (saveStockTakeBtn) {
    saveStockTakeBtn.onclick = async () => {
      const updates = {};
      document.querySelectorAll('.physical-count-input').forEach(input => {
        const id = input.dataset.id;
        const unit = input.dataset.unit;
        const physicalVal = Number(input.value) || 0;
        const gramsMl = getConvertedGramsMl(physicalVal, unit);
        updates[`rawMaterials/${id}/stockGrams`] = gramsMl;
      });
      await db.ref().update(updates);
      toast('Physical stock take reconciled & system stock updated!', 'check-circle');
      session.showStockTakeModal = false;
      render();
    };
  }

  /* ADD CUSTOM PAYMENT MODE */
  const addCustomPaymentBtn = document.getElementById('addCustomPaymentBtn');
  if (addCustomPaymentBtn) {
    addCustomPaymentBtn.onclick = async () => {
      const input = document.getElementById('newCustomPaymentInput');
      const val = input ? input.value.trim() : '';
      if (!val) { toast('Enter a valid payment mode name.', 'alert-triangle'); return; }
      if (!DB.paymentModes.includes(val)) {
        DB.paymentModes.push(val);
        session.billingPaymentMode = val;
        session.newCustomPayment = '';
        await db.ref('paymentModes').set(DB.paymentModes);
        toast(`Added custom payment mode: ${val}`, 'check-circle');
        renderKeepFocus('posTableInput');
      }
    };
  }

  /* PURCHASE INWARDING & 5% RATE VARIANCE CHECK */
  const validatePurchaseBtn = document.getElementById('validatePurchaseBtn');
  if (validatePurchaseBtn) {
    validatePurchaseBtn.onclick = () => {
      const rmName = document.getElementById('purchaseRmSelect').value;
      const invoiceNo = document.getElementById('purchaseInvoiceNo').value.trim() || 'INV-001';
      const vendor = document.getElementById('purchaseVendor').value.trim() || 'Vendor';
      const qty = Number(document.getElementById('purchaseQtyInput').value) || 0;
      const unit = document.getElementById('purchaseUnitSelect').value;
      const totalAmount = Number(document.getElementById('purchaseTotalCostInput').value) || 0;

      if (!rmName || qty <= 0 || totalAmount <= 0) {
        toast('Please fill in material, quantity, and total cost.', 'alert-triangle');
        return;
      }

      const rm = DB.rawMaterials.find(r => r.name.toLowerCase().trim() === rmName.toLowerCase().trim());
      const oldRate = rm ? Number(rm.unitPrice || 0) : 0;
      const addedGrams = getConvertedGramsMl(qty, unit);
      const newRate = totalAmount / (addedGrams / 1000);

      // Check if price variance > 5%
      if (oldRate > 0) {
        const percentDiff = Math.abs(((newRate - oldRate) / oldRate) * 100);
        if (percentDiff > 5) {
          session.purchaseItemDiffWarning = {
            rmId: rm.id,
            invoiceNo,
            vendor,
            itemName: rmName,
            qty,
            unit,
            totalAmount,
            oldRate,
            newRate,
            percentDiff: percentDiff.toFixed(1)
          };
          render();
          return;
        }
      }

      executePurchaseSave(rm, invoiceNo, vendor, rmName, qty, unit, totalAmount, newRate);
    };
  }

  const confirmPurchaseAnywayBtn = document.getElementById('confirmPurchaseAnywayBtn');
  if (confirmPurchaseAnywayBtn) {
    confirmPurchaseAnywayBtn.onclick = async () => {
      const diff = session.purchaseItemDiffWarning;
      if (!diff) return;
      const rm = DB.rawMaterials.find(r => r.id === diff.rmId);
      session.purchaseItemDiffWarning = null;
      await executePurchaseSave(rm, diff.invoiceNo, diff.vendor, diff.itemName, diff.qty, diff.unit, diff.totalAmount, diff.newRate);
    };
  }

  const cancelPurchaseWarningBtn = document.getElementById('cancelPurchaseWarningBtn');
  if (cancelPurchaseWarningBtn) {
    cancelPurchaseWarningBtn.onclick = () => {
      session.purchaseItemDiffWarning = null;
      render();
    };
  }

  /* POS CART ACTIONS */
  document.querySelectorAll('.add-pos-item').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.id;
      const m = DB.menu.find(x => x.id === id);
      if (!m) return;
      const existing = session.billingCart.find(i => i.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        session.billingCart.push({ id: m.id, name: m.name, price: m.price, qty: 1, kind: 'cafe' });
      }
      renderKeepFocus('posTableInput');
    };
  });

  document.querySelectorAll('.remove-pos-item').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.idx);
      session.billingCart.splice(idx, 1);
      renderKeepFocus('posTableInput');
    };
  });

  document.querySelectorAll('.pos-pay-mode-btn').forEach(btn => {
    btn.onclick = () => {
      session.billingPaymentMode = btn.dataset.mode;
      renderKeepFocus('posTableInput');
    };
  });

  const completePosBillingBtn = document.getElementById('completePosBillingBtn');
  if (completePosBillingBtn) {
    completePosBillingBtn.onclick = async () => {
      if (session.billingCart.length === 0) {
        toast('Cart is empty. Add items to bill.', 'alert-triangle');
        return;
      }

      const table = document.getElementById('posTableInput').value.trim() || '1';
      const custName = document.getElementById('posCustName').value.trim() || 'POS Customer';
      const custPhone = document.getElementById('posCustPhone').value.trim() || '';
      const orderType = document.getElementById('posBillingTypeSelect').value;

      const orderId = Math.floor(1000 + Math.random() * 9000).toString();
      const newOrder = {
        id: orderId,
        table: table,
        type: orderType === 'qr' ? 'qr' : 'cafe',
        customerName: custName,
        customerPhone: custPhone,
        items: [...session.billingCart],
        paymentMode: session.billingPaymentMode,
        status: 'served',
        ts: Date.now(),
        completedTs: Date.now()
      };

      await db.ref('orders/' + orderId).set(newOrder);

      for (const item of session.billingCart) {
        if (item.id) {
          await processBOMDeduction(item.id, item.qty);
        }
      }

      toast(`Order #${orderId} billed successfully & BOM stock updated!`, 'check-circle');
      session.billingCart = [];
      session.showBillingModal = false;
      playLoudAlarm();
      render();
    };
  }

  /* WASTAGE LOGGING SUBMISSION */
  const submitWastageBtn = document.getElementById('submitWastageBtn');
  if (submitWastageBtn) {
    submitWastageBtn.onclick = async () => {
      const rmName = document.getElementById('wastageRmSelect').value;

    }
  });

  document.querySelectorAll('.stock-toggle').forEach(b => b.onclick = async () => {
    const kind = b.dataset.kind;
    const arr = kind === 'menu' ? DB.menu : DB.retail;
    const it = arr.find(x => x.id === b.dataset.id);
    it.stock = !it.stock;
    await db.ref(`${kind}/${it.id}`).update({ stock: it.stock });
    render(); toast(it.name + ' marked ' + (it.stock ? 'in stock' : 'out of stock'), it.stock ? 'check-circle' : 'ban');
  });

  document.querySelectorAll('.edit-item').forEach(b => b.onclick = () => {
    if (b.dataset.kind === 'menu') session.editingDish = b.dataset.id; else session.editingRetail = b.dataset.id;
    render();
  });

  document.querySelectorAll('.delete-item').forEach(b => b.onclick = async () => {
    if (!confirm('Remove this item?')) return;
    const kind = b.dataset.kind;
    await db.ref(`${kind}/${b.dataset.id}`).remove();
    render();
  });

  const addDish = document.getElementById('addDishBtn'); if (addDish) addDish.onclick = () => { session.editingDish = 'new'; render(); };
  const addRetail = document.getElementById('addRetailBtn'); if (addRetail) addRetail.onclick = () => { session.editingRetail = 'new'; render(); };

  const saveDish = document.getElementById('saveDishBtn');
  if (saveDish) saveDish.onclick = async () => {
    const badges = Array.from(document.querySelectorAll('.dBadge:checked')).map(c => c.value);
    const fileInput = document.getElementById('dImgFile');
    const existing = saveDish.dataset.id ? DB.menu.find(m => m.id === saveDish.dataset.id) : null;
    let imgData = existing ? existing.img : '';

    if (fileInput && fileInput.files[0]) {
      toast('Compressing photo...', 'image');
      imgData = await compressAndGetBase64(fileInput.files[0]);
    }

    const payload = {
      id: saveDish.dataset.id || uid('m'),
      name: document.getElementById('dName').value.trim(),
      category: document.getElementById('dCategory').value.trim(),
      price: Number(document.getElementById('dPrice').value) || 0,
      img: imgData,
      desc: document.getElementById('dDesc').value.trim(),
      badges, stock: true,
      nutrition: { cal: Number(document.getElementById('dCal').value) || 0, protein: Number(document.getElementById('dProt').value) || 0, carbs: Number(document.getElementById('dCarb').value) || 0, fat: Number(document.getElementById('dFat').value) || 0 }
    };
    if (!payload.name) { toast('Please enter a dish name.', 'alert-triangle'); return; }

    await db.ref('menu/' + payload.id).set(payload);
    session.editingDish = null; render(); toast('Dish saved cloud-wide!');
  };

  const saveRetail = document.getElementById('saveRetailBtn');
  if (saveRetail) saveRetail.onclick = async () => {
    const fileInput = document.getElementById('rImgFile');
    const existing = saveRetail.dataset.id ? DB.retail.find(m => m.id === saveRetail.dataset.id) : null;
    let imgData = existing ? existing.img : '';

    if (fileInput && fileInput.files[0]) {
      toast('Compressing photo...', 'image');
      imgData = await compressAndGetBase64(fileInput.files[0]);
    }

    const payload = {
      id: saveRetail.dataset.id || uid('r'),
      name: document.getElementById('rName').value.trim(),
      category: document.getElementById('rCategory').value.trim(),
      price: Number(document.getElementById('rPrice').value) || 0,
      size: document.getElementById('rSize').value.trim(),
      img: imgData,
      desc: document.getElementById('rDesc').value.trim(),
      badges: ['100% Organic'],
      stock: true
    };
    if (!payload.name) { toast('Please enter a product name.', 'alert-triangle'); return; }

    await db.ref('retail/' + payload.id).set(payload);
    session.editingRetail = null; render(); toast('Product saved cloud-wide!');
  };
}

async function executePurchaseSave(rm, invoiceNo, vendor, rmName, qty, unit, totalAmount, newRate) {
  if (rm) {
    const addedGrams = getConvertedGramsMl(qty, unit);
    const currentStock = Number(rm.stockGrams ?? 100000);
    const newStock = currentStock + addedGrams;

    await db.ref(`rawMaterials/${rm.id}/stockGrams`).set(newStock);
    await db.ref(`rawMaterials/${rm.id}/unitPrice`).set(newRate);
  }

  const purchaseLog = {
    id: uid('p'),
    invoiceNo,
    vendor,
    itemName: rmName,
    qty,
    unit,
    totalAmount,
    rate: newRate,
    staff: session.staff.username,
    ts: Date.now()
  };

  DB.purchases.push(purchaseLog);
  await db.ref('purchases').set(DB.purchases);

  toast('Purchase entry recorded & inventory stock updated!', 'check-circle');
  session.showPurchaseModal = false;
  render();
}

function renderKeepFocus(inputId) {
  const activeEl = document.getElementById(inputId);
  const start = activeEl ? activeEl.selectionStart : null;
  const end = activeEl ? activeEl.selectionEnd : null;

  render();

  const el = document.getElementById(inputId);
  if (el) {
    el.focus();
    if (start !== null && end !== null) el.setSelectionRange(start, end);
  }
}

db.ref('menu').on('value', snap => {
  const data = snap.val();
  DB.menu = data ? Object.values(data) : [];
  if (session.editingDish === null) render();
});

db.ref('retail').on('value', snap => {
  const data = snap.val();
  DB.retail = data ? Object.values(data) : [];

  render();
});

db.ref('rawMaterials').on('value', snap => {
  const data = snap.val();
  DB.rawMaterials = data ? Object.values(data) : [];
  render();
});

db.ref('baseRecipes').on('value', snap => {

  render();
});

db.ref('recipes').on('value', snap => {
  const data = snap.val();

  render();
});

db.ref('wastageLogs').on('value', snap => {
  const data = snap.val();

  render();
});

db.ref('purchases').on('value', snap => {
  const data = snap.val();
  DB.purchases = data || [];
  render();
});

db.ref('paymentModes').on('value', snap => {
  const data = snap.val();

db.ref('settings').on('value', snap => {

});

(function boot() {
  document.addEventListener('touchstart', unlockAudio, { once: true });
  document.addEventListener('click', unlockAudio, { once: true });
  render();
})();
</script>
