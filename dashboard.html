function getBase64(file) {
  return new Promise((resolve, reject) => {
    if (!file) resolve('');
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
  });
}

let actx = null;
function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch(e) {}
}

function playLoudAlarm() {
  if (!session.soundOn || !session.staff) return;
  unlockAudio();
  if (!actx) return;

  const now = actx.currentTime;
  [0, 0.25, 0.5, 0.75].forEach(delay => {
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(delay % 0.5 === 0 ? 950 : 1250, now + delay);
    g.gain.setValueAtTime(0.5, now + delay);
    g.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.2);
    o.connect(g);
    g.connect(actx.destination);
    o.start(now + delay);
    o.stop(now + delay + 0.2);
  });
}

function money(n) { return '₹' + Number(n).toFixed(0); }
function uid(p) { return p + '_' + Math.random().toString(36).slice(2, 9); }
function toast(msg, icon) {
  const host = document.getElementById('toastHost'); if (!host) return;
  const el = document.createElement('div');
  el.className = 'modal-fade pointer-events-auto bg-brand-900 text-cream px-4 py-2.5 rounded-full shadow-lg text-sm font-medium flex items-center gap-2';
  el.innerHTML = `<i data-lucide="${icon || 'check-circle'}" class="w-4 h-4 text-gold-400"></i><span>${msg}</span>`;
  host.appendChild(el); lucide.createIcons();
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2600);
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return s + 's ago';
  const m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
  const h = Math.floor(m / 60); return h + 'h ago';
}

function formatDuration(ms) {
  if (!ms || ms < 0) return '—';
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}m ${s}s`;
}

function formatTime(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function wireLogin() {
  document.getElementById('loginSubmit').onclick = () => {
    unlockAudio();
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value;
    const found = DB.staff.find(s => s.username === u && s.password === p);
    const err = document.getElementById('loginError');
    if (found) {
      session.staff = found; session.kitchenTab = 'orders'; render(); toast('Welcome back, ' + found.username, 'log-in');
    } else {
      err.textContent = 'Incorrect username or password.'; err.classList.remove('hidden');
    }
  };
}

function wireKitchen() {
  document.getElementById('logoutBtn').onclick = () => { session.staff = null; render(); };
  document.getElementById('soundToggle').onclick = () => { unlockAudio(); session.soundOn = !session.soundOn; render(); };
  document.querySelectorAll('.k-tab').forEach(b => b.onclick = () => { session.kitchenTab = b.dataset.ktab; render(); });

  document.querySelectorAll('.advance-order').forEach(b => b.onclick = async () => {
    const o = DB.orders.find(x => x.id === b.dataset.id);
    if (o) {
      const nextStatus = b.dataset.next;
      const updates = { status: nextStatus };
      if (nextStatus === 'served') {
        updates.completedTs = Date.now();
      }
      await db.ref('orders/' + o.id).update(updates);
      render();
    }
  });

  document.querySelectorAll('.stock-toggle').forEach(b => b.onclick = async () => {
    const kind = b.dataset.kind;
    const arr = kind === 'menu' ? DB.menu : DB.retail;
    const it = arr.find(x => x.id === b.dataset.id);
    it.stock = !it.stock;
    await db.ref(`${kind}/${it.id}`).update({ stock: it.stock });
    render(); toast(it.name + ' marked ' + (it.stock ? 'in stock' : 'out of stock'), it.stock ? 'check-circle' : 'ban');
  });

  document.querySelectorAll('.edit-item').forEach(b => b.onclick = () => {
    if (b.dataset.kind === 'menu') session.editingDish = b.dataset.id; else session.editingRetail = b.dataset.id;
    render();
  });

  document.querySelectorAll('.delete-item').forEach(b => b.onclick = async () => {
    if (!confirm('Remove this item?')) return;
    const kind = b.dataset.kind;
    await db.ref(`${kind}/${b.dataset.id}`).remove();
    render();
  });

  const addDish = document.getElementById('addDishBtn'); if (addDish) addDish.onclick = () => { session.editingDish = 'new'; render(); };
  const addRetail = document.getElementById('addRetailBtn'); if (addRetail) addRetail.onclick = () => { session.editingRetail = 'new'; render(); };

  const dlCafeBtn = document.getElementById('dlCafeTemplateBtn');
  if (dlCafeBtn) dlCafeBtn.onclick = () => downloadCafeTemplate();

  const dlRetailBtn = document.getElementById('dlRetailTemplateBtn');
  if (dlRetailBtn) dlRetailBtn.onclick = () => downloadRetailTemplate();

  const saveDish = document.getElementById('saveDishBtn');
  if (saveDish) saveDish.onclick = async () => {
    const badges = Array.from(document.querySelectorAll('.dBadge:checked')).map(c => c.value);
    const fileInput = document.getElementById('dImgFile');
    const existing = saveDish.dataset.id ? DB.menu.find(m => m.id === saveDish.dataset.id) : null;
    let imgData = existing ? existing.img : '';

    if (fileInput && fileInput.files[0]) {
      imgData = await getBase64(fileInput.files[0]);
    }

    const payload = {
      id: saveDish.dataset.id || uid('m'),
      name: document.getElementById('dName').value.trim(),
      category: document.getElementById('dCategory').value.trim(),
      price: Number(document.getElementById('dPrice').value) || 0,
      img: imgData,
      desc: document.getElementById('dDesc').value.trim(),
      badges, stock: true,
      nutrition: { cal: Number(document.getElementById('dCal').value) || 0, protein: Number(document.getElementById('dProt').value) || 0, carbs: Number(document.getElementById('dCarb').value) || 0, fat: Number(document.getElementById('dFat').value) || 0 }
    };
    if (!payload.name) { toast('Please enter a dish name.', 'alert-triangle'); return; }

    await db.ref('menu/' + payload.id).set(payload);
    session.editingDish = null; render(); toast('Dish saved cloud-wide!');
  };
  const cancelDish = document.getElementById('cancelDishBtn'); if (cancelDish) cancelDish.onclick = () => { session.editingDish = null; render(); };

  const saveRetail = document.getElementById('saveRetailBtn');
  if (saveRetail) saveRetail.onclick = async () => {
    const fileInput = document.getElementById('rImgFile');
    const existing = saveRetail.dataset.id ? DB.retail.find(m => m.id === saveRetail.dataset.id) : null;
    let imgData = existing ? existing.img : '';

    if (fileInput && fileInput.files[0]) {
      imgData = await getBase64(fileInput.files[0]);
    }

    const payload = {
      id: saveRetail.dataset.id || uid('r'),
      name: document.getElementById('rName').value.trim(),
      category: document.getElementById('rCategory').value.trim(),
      price: Number(document.getElementById('rPrice').value) || 0,
      size: document.getElementById('rSize').value.trim(),
      img: imgData,
      desc: document.getElementById('rDesc').value.trim(),
      badges: ['100% Organic'],
      stock: true
    };
    if (!payload.name) { toast('Please enter a product name.', 'alert-triangle'); return; }

    await db.ref('retail/' + payload.id).set(payload);
    session.editingRetail = null; render(); toast('Product saved cloud-wide!');
  };
  const cancelRetail = document.getElementById('cancelRetailBtn'); if (cancelRetail) cancelRetail.onclick = () => { session.editingRetail = null; render(); };

  const processBtn = document.getElementById('processExcelBtn');
  if (processBtn) {
    processBtn.onclick = () => {
      const fileInput = document.getElementById('excelFileInput');
      if (!fileInput || !fileInput.files[0]) {
        toast('Please select an Excel or CSV file first.', 'alert-triangle');
        return;
      }

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const json = XLSX.utils.sheet_to_json(worksheet);

          if (!json.length) {
            toast('The selected Excel sheet is empty.', 'alert-triangle');
            return;
          }

          let cafeCount = 0;
          let retailCount = 0;

          for (const row of json) {
            const kind = (row.type || 'cafe').toString().toLowerCase().trim();
            const badges = row.badges ? row.badges.toString().split(',').map(b => b.trim()) : ['100% Organic'];

            if (kind === 'cafe') {
              const id = uid('m');
              await db.ref('menu/' + id).set({
                id,
                name: (row.name || 'Untitled Dish').toString().trim(),
                category: (row.category || 'Millet Bowls').toString().trim(),
                price: Number(row.price) || 0,
                desc: (row.desc || '').toString().trim(),
                img: (row.img || '').toString().trim(),
                badges,
                stock: true,
                nutrition: {
                  cal: Number(row.cal) || 0,
                  protein: Number(row.protein) || 0,
                  carbs: Number(row.carbs) || 0,
                  fat: Number(row.fat) || 0
                }
              });
              cafeCount++;
            } else {
              const id = uid('r');
              await db.ref('retail/' + id).set({
                id,
                name: (row.name || 'Untitled Product').toString().trim(),
                category: (row.category || 'Oils & Ghee').toString().trim(),
                price: Number(row.price) || 0,
                size: (row.size || '').toString().trim(),
                desc: (row.desc || '').toString().trim(),
                img: (row.img || '').toString().trim(),
                badges,
                stock: true
              });
              retailCount++;
            }
          }

          toast(`Bulk upload complete! Added ${cafeCount} Cafe dishes & ${retailCount} Retail items.`, 'check-circle');
        } catch (err) {
          toast('Error parsing Excel file. Check format.', 'alert-triangle');
        }
      };
      reader.readAsArrayBuffer(fileInput.files[0]);
    };
  }

  const printBtn = document.getElementById('printAllBtn'); if (printBtn) printBtn.onclick = () => window.print();

  const saveBrand = document.getElementById('saveBrandBtn');
  if (saveBrand) saveBrand.onclick = async () => {
    DB.settings.restaurantName = document.getElementById('brandName').value.trim() || DB.settings.restaurantName;
    DB.settings.tagline = document.getElementById('brandTagline').value.trim();
    
    const fileInput = document.getElementById('brandLogoFile');
    if (fileInput && fileInput.files[0]) {
      DB.settings.logoUrl = await getBase64(fileInput.files[0]);
    }

    await db.ref('settings').set(DB.settings);
    render(); toast('Brand settings saved cloud-wide!', 'image');
  };

  const resetLogo = document.getElementById('resetLogoBtn');
  if (resetLogo) resetLogo.onclick = async () => {
    DB.settings.logoUrl = DEFAULT_LOGO;
    await db.ref('settings').set(DB.settings);
    render(); toast('Logo reset.');
  };

  const addStaffBtn = document.getElementById('addStaffBtn'); if (addStaffBtn) addStaffBtn.onclick = () => { session.showAddStaff = true; render(); };
  const saveStaffBtn = document.getElementById('saveStaffBtn');
  if (saveStaffBtn) saveStaffBtn.onclick = async () => {
    const u = document.getElementById('newStaffUser').value.trim();
    const p = document.getElementById('newStaffPass').value;
    const r = document.getElementById('newStaffRole').value;
    if (!u || !p) { toast('Username and password required.', 'alert-triangle'); return; }
    if (DB.staff.some(s => s.username === u)) { toast('Username already exists.', 'alert-triangle'); return; }
    
    const newStaff = { id: uid('u'), username: u, password: p, role: r };
    DB.staff.push(newStaff);
    await db.ref('staff/' + newStaff.id).set(newStaff);
    session.showAddStaff = false; render(); toast('Staff created.', 'user-plus');
  };
}

db.ref('menu').on('value', snap => {
  const data = snap.val();
  DB.menu = data ? Object.values(data) : [];
  if (session.editingDish === null) render();
});

db.ref('retail').on('value', snap => {
  const data = snap.val();
  DB.retail = data ? Object.values(data) : [];
  if (session.editingRetail === null) render();
});

db.ref('orders').on('value', snap => {
  const data = snap.val();
  DB.orders = data ? Object.values(data) : [];
  render();
});

db.ref('settings').on('value', snap => {
  const data = snap.val();
  if (data) { DB.settings = data; render(); }
});

setInterval(() => {
  const pendingOrders = DB.orders.filter(o => o.status === 'received');
  if (pendingOrders.length > 0 && session.staff && session.soundOn) {
    playLoudAlarm();
  }
}, 5000);

(function boot() {
  document.addEventListener('touchstart', unlockAudio, { once: true });
  document.addEventListener('click', unlockAudio, { once: true });
  render();
})();
</script>
</body>
